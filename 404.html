<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- iOS paints the strip behind the clock/battery with this; without it the page
     got the default light chrome above its dark header. Matches the TOP of the
     sticky header's gradient below. -->
<meta name="theme-color" content="#221D16">
<title>Lightware — المستودع</title>
<!-- The warehouse's own mark: the house L. redrawn as a W. on a cream tile. The
     GROUND is what tells it from the storefront and the portal at 16px — a letter
     is 3 or 4 pixels of ink there and every letter looks the same. Masters + the
     reasoning: brand/logo/build_appicons.py. ⚠ Edit them THERE and copy across.
     ⚠ Both files must also be listed in deploy.sh's warehouse block: that site is
     staged file by file, so anything not copied there 404s live. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Amr keeps this page on his phone's home screen (§5A), where it had no icon at
     all and iOS drew a screenshot of the page. iOS truncates the label to roughly
     12 characters, so it gets the short name, not the whole <title>. Deliberately
     NOT -capable: that launches standalone and drops Safari's back button. -->
<meta name="apple-mobile-web-app-title" content="المستودع">
  <!-- Internal tool. Login-walled, but the shell HTML is public on GitHub Pages —
       without this Google indexes a staff console under the brand name and
       competes with www for the "Lightware" query. robots.txt ALLOWS crawling
       on purpose: a Disallow would stop Google reading this very tag. -->
  <meta name="robots" content="noindex,nofollow" />
<style>
  :root{
    /* Aug 4 2026 premium pass — paint values only, zero layout changes */
    --ink:#1C1813; --paper:#F8F4EC; --amber:#E8870B; --glow:#FCEDD8;
    --card:#FFFFFF; --line:#E9E1D1; --muted:#8B8170;
    --stockout:#8B0000; --red:#DE4433; --yellow:#F1C40F; --green:#219653; --untracked:#B9B2A3;
    --chrome:#262019; --chrome-line:#3D352A;
    --shadow-1:0 1px 2px rgba(28,24,19,.05), 0 3px 10px rgba(28,24,19,.04);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--paper); color:var(--ink);
       font-family:-apple-system,"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;
       -webkit-font-smoothing:antialiased}
  .qty,.cost,.chip .n,.count{font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  header{background:linear-gradient(180deg,#221D16,#1C1813 68%); color:var(--glow);
         padding:14px 16px 12px; position:sticky; top:0; z-index:10;
         box-shadow:0 1px 0 rgba(232,135,11,.16)}
  .brand{display:flex; align-items:center; justify-content:space-between}
  /* Lightware wordmark: light letterspaced caps + amber period (brand assets in brand/logo/) */
  .wordmark{font-size:16px; font-weight:300; letter-spacing:4px; color:#F2ECDF;
            white-space:nowrap; direction:ltr; unicode-bidi:embed}
  .wordmark .dot{color:var(--amber); font-weight:600; letter-spacing:0}
  /* the sync time has its own line under the wordmark row: inline beside four buttons it
     wrapped into a 4-line column and overprinted «LIGHTWARE.» at phone width (seen 23 Nov 2026) */
  .sync{font-size:11px; color:#C9A871; text-align:left; direction:ltr; margin-top:6px}
  html[dir="ltr"] .sync{text-align:right}

  /* ---------- search ---------- */
  .searchwrap{padding:12px 16px 4px; background:#1C1813}
  #search{width:100%; padding:13px 16px; font-size:16px; border:none; border-radius:12px;
          background:var(--chrome); color:var(--glow); outline:none;
          box-shadow:inset 0 0 0 1px var(--chrome-line);
          transition:box-shadow .15s ease}
  #search::placeholder{color:#7d7568}
  #search:focus{box-shadow:0 0 0 2px var(--amber)}

  /* ---------- filter chips ---------- */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 16px; background:#1C1813;
         scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; padding:7px 14px; border-radius:999px; font-size:13px; border:1px solid var(--chrome-line);
        background:var(--chrome); color:#CFC6B4; cursor:pointer; user-select:none;
        transition:background-color .15s ease,border-color .15s ease,color .15s ease}
  .chip .n{opacity:.7; font-size:11px; margin-inline-start:4px}
  .chip.active{background:linear-gradient(180deg,#F09A22,var(--amber)); border-color:#C9720A;
        color:#211505; font-weight:600;
        box-shadow:0 2px 8px rgba(232,135,11,.35), inset 0 1px 0 rgba(255,255,255,.25)}

  /* ---------- list ---------- */
  main{padding:12px 12px 40px; max-width:640px; margin:0 auto}
  .item{background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px;
        border-inline-start:6px solid var(--untracked); box-shadow:var(--shadow-1)}
  .item.STOCKOUT{border-inline-start-color:var(--stockout)}
  .item.RED{border-inline-start-color:var(--red)}
  .item.YELLOW{border-inline-start-color:var(--yellow)}
  .item.GREEN{border-inline-start-color:var(--green)}
  .thumb{width:52px; height:52px; border-radius:10px; object-fit:cover; flex:0 0 auto;
         border:1px solid var(--line); background:#F4F0E8; cursor:zoom-in}

  /* ---------- image lightbox ---------- */
  .lightbox{position:fixed; inset:0; z-index:100; background:rgba(20,20,20,.78);
            display:none; align-items:center; justify-content:center; padding:24px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:92vw; max-height:80vh; border-radius:14px; background:#fff;
                box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .lightbox .close{position:absolute; top:calc(env(safe-area-inset-top, 0px) + 16px);
                   inset-inline-end:16px; width:42px; height:42px; border:none;
                   border-radius:999px; background:#fff; color:#141414; font-size:19px;
                   cursor:pointer}
  .info{flex:1; min-width:0}
  .name{font-size:14.5px; font-weight:600; line-height:1.35; word-break:break-word}
  /* code · latin ref: always LTR text, but aligned to the CARD's start edge —
     so it flips with the document, not with its own direction */
  .meta{font-size:12px; color:var(--muted); margin-top:3px; direction:ltr; text-align:right}
  html[dir="ltr"] .meta{text-align:left}
  .side{text-align:center; flex:0 0 auto}
  .qty{font-size:20px; font-weight:700; line-height:1}
  .cost{font-size:11px; color:#7FBF7F; font-weight:700; margin-top:2px}
  .stores{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px}
  .storetag{font-size:10.5px; color:var(--muted); background:#FAF7F0;
    border:1px solid var(--line); border-radius:6px; padding:1px 6px; white-space:nowrap;
    max-width:100%; overflow:hidden; text-overflow:ellipsis}
  .storetag b{color:#1C1813}
  .storetag .shelf{color:#E8870B; font-weight:700}
  /* «🪧 عند التجار» — ours, but on a merchant's shelf (consignment) */
  .storetag.mstag{background:var(--glow); border-color:var(--amber); color:#1C1813; font-weight:600}
  .storetag.mstag b{color:#B36405}
  .chip.ms{border-color:#8A5A1C}
  /* 📦 pieces per package — Al-Ameen's second unit («طرد» × N), Oct 2026 */
  .storetag.packtag{border-color:#D9C9A6}
  .authbtn{background:none; border:1px solid #3a352e; border-radius:8px;
    padding:4px 9px; font-size:14px; cursor:pointer; color:inherit}
  .authcard{background:#1D1915; border:1px solid #3a352e; border-radius:14px;
    padding:20px; width:min(320px,88vw); display:flex; flex-direction:column; gap:10px}
  .authcard input{background:#16130F; border:1px solid #3a352e; border-radius:10px;
    padding:10px 12px; color:inherit; font:inherit}
  .authgo{background:#E8870B; color:#1a1a1a; font-weight:700; border:none;
    border-radius:10px; padding:11px; cursor:pointer; font:inherit}
  .autherr{color:#E07B6A; font-size:12px; min-height:14px}
  .unit{font-size:11px; color:var(--muted)}
  .tag{display:inline-block; margin-top:6px; padding:3px 10px; border-radius:999px;
       font-size:11px; font-weight:700; color:#fff; background:var(--untracked);
       letter-spacing:.01em; box-shadow:0 1px 2px rgba(28,24,19,.12)}
  .tag.STOCKOUT{background:var(--stockout)} .tag.RED{background:var(--red)}
  .tag.YELLOW{background:var(--yellow); color:#1a1a1a} .tag.GREEN{background:var(--green)}
  .cover{font-size:11px; color:var(--muted); margin-top:4px}

  .state{padding:48px 20px; text-align:center; color:var(--muted); font-size:15px}
  .count{font-size:12px; color:var(--muted); margin:4px 4px 10px}
  @media (prefers-reduced-motion:no-preference){
    .item{transition:transform .08s ease} .item:active{transform:scale(.985)}
  }
  /* ---------- custom brand dropdown ---------- */
  .filterbar { display: flex; gap: 10px; padding: 0 16px 12px; background: #1C1813; }
  .custom-select-wrapper { position: relative; flex: 1; user-select: none; }
  .custom-select-trigger {
    width: 100%; padding: 12px 38px 12px 14px; font-size: 15px; border: none;
    border-radius: 12px; background: var(--chrome); color: var(--glow); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: inset 0 0 0 1px var(--chrome-line);
  }
  .custom-select-trigger:focus { box-shadow: 0 0 0 2px var(--amber); outline: none; }
  .custom-select-trigger::after {
    content: "▾"; position: absolute; inset-inline-start: 14px; 
    top: 50%; transform: translateY(-50%); color: #C9A871; font-size: 13px;
  }
  .custom-options {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
    background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 12px;
    overflow: hidden; display: none; z-index: 100; max-height: 250px; overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .custom-options.open { display: block; }
  .custom-option { padding: 12px 14px; color: var(--glow); cursor: pointer; font-size: 15px; border-bottom: 1px solid var(--chrome-line); }
  .custom-option:last-child { border-bottom: none; }
  .custom-option.selected { color: var(--amber); font-weight: 600; }

  /* ---------- qty sort pill (cycles: default → high→low → low→high) ---------- */
  .sortpill {
    flex: 0 0 auto; padding: 12px 14px; font-size: 15px; border: none;
    border-radius: 12px; background: var(--chrome); color: var(--glow); cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    box-shadow: inset 0 0 0 1px var(--chrome-line);
  }
  .sortpill.active { color: var(--amber); font-weight: 600; box-shadow: inset 0 0 0 1px var(--amber); }
  .sortpill:focus { outline: none; box-shadow: 0 0 0 2px var(--amber); }

  /* ---------- «اختار ← نقلة / عرض سعر / مساطر» (23 Nov 2026) ----------
     team login only. A circle on every card picks it; once one is picked, a tap
     anywhere on a card picks or un-picks it (the thumb still zooms). The tray
     at the foot carries the three documents; the sheet sets the quantities. */
  .countrow{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:4px 4px 10px}
  .countrow .count{margin:0}
  .selall{background:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px;
    font:inherit; font-size:12.5px; font-weight:600; color:#8A5A1C; cursor:pointer; white-space:nowrap}
  .selall:active{background:var(--glow)}
  .pick{flex:0 0 auto; width:44px; height:44px; margin:-8px -6px; padding:0; border:none; background:none;
    cursor:pointer; display:flex; align-items:center; justify-content:center}
  .pick .ring{width:28px; height:28px; border-radius:999px; border:2px solid #CDBFA6; background:#fff;
    color:#fff; font-size:16px; font-weight:800; line-height:24px; text-align:center}
  .item.picked{background:#FFF8EE; box-shadow:0 0 0 2px var(--amber), var(--shadow-1)}
  .item.picked .pick .ring{background:var(--amber); border-color:#C9720A}
  body.picking .item{cursor:pointer}
  body.hastray main{padding-bottom:170px}
  #tray{position:fixed; inset-inline:0; bottom:0; z-index:50; background:linear-gradient(180deg,#221D16,#1C1813);
    color:var(--glow); padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 18px rgba(28,24,19,.28); border-top:1px solid rgba(232,135,11,.35)}
  #tray[hidden]{display:none}
  .trayin{max-width:640px; margin:0 auto}
  .trayhead{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .traycount{flex:1; min-width:0; display:flex; align-items:center; gap:6px; background:var(--chrome);
    border:1px solid var(--chrome-line); color:var(--glow); border-radius:12px; padding:10px 12px;
    font:inherit; font-size:15px; cursor:pointer; text-align:start}
  .traycount b{color:var(--amber); font-size:17px}
  .traycount .more{margin-inline-start:auto; color:#C9A871; font-size:13px; white-space:nowrap}
  .trayx{flex:0 0 auto; width:44px; height:44px; border-radius:12px; border:1px solid var(--chrome-line);
    background:var(--chrome); color:#CFC6B4; font-size:17px; cursor:pointer}
  .trayacts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .trayact{min-height:48px; border-radius:12px; border:none; cursor:pointer; font:inherit; font-size:15px;
    font-weight:700; color:#211505; background:linear-gradient(180deg,#F09A22,var(--amber));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25); padding:6px 4px; line-height:1.2}
  .trayact:active{transform:translateY(1px)}
  .trayundo{display:flex; align-items:center; gap:8px; font-size:13px; color:#E6D9BF; line-height:1.4}
  .trayundo span{flex:1; min-width:0}
  .trayundo button{flex:0 0 auto; background:none; border:1px solid var(--chrome-line); color:var(--amber);
    border-radius:999px; padding:7px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer}
  .sheetwrap{position:fixed; inset:0; z-index:90; background:rgba(20,17,13,.55); display:none;
    align-items:flex-end; justify-content:center}
  .sheetwrap.open{display:flex}
  .sheet{background:var(--paper); width:100%; max-width:640px; max-height:88vh; display:flex; flex-direction:column;
    border-radius:18px 18px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.35);
    padding-bottom:env(safe-area-inset-bottom)}
  .sheethead{display:flex; align-items:center; gap:8px; padding:14px 14px 10px; border-bottom:1px solid var(--line)}
  .sheethead b{flex:1; font-size:16px}
  .sheethead button{width:40px; height:40px; border-radius:999px; border:1px solid var(--line); background:#fff;
    font-size:16px; cursor:pointer; color:var(--ink)}
  .sheetlist{overflow-y:auto; padding:6px 12px; flex:1 1 auto}
  .prow{display:flex; gap:10px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:none}
  .prow .pthumb{width:40px; height:40px; border-radius:8px; object-fit:cover; border:1px solid var(--line);
    background:#F4F0E8; flex:0 0 auto}
  .prow .pinfo{flex:1; min-width:0}
  .prow .pname{font-size:14px; font-weight:600; line-height:1.35; word-break:break-word}
  .prow .pmeta{font-size:12px; color:var(--muted); margin-top:2px}
  .prow.bad{background:#FFF1EE}
  .pqty{display:flex; align-items:center; gap:6px; margin-top:8px; direction:ltr}
  .pqty button{width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:#fff;
    font-size:20px; font-weight:700; color:var(--ink); cursor:pointer; line-height:1}
  .pqty input{width:72px; height:40px; border-radius:10px; border:1px solid var(--line); background:#fff;
    font:inherit; font-size:16px; font-weight:700; text-align:center; color:var(--ink)}
  .pqty input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 2px rgba(232,135,11,.2)}
  .prow.bad .pqty input{border-color:var(--red)}
  /* ✕ sits at the far end of the row, never beside «+» (a mis-tap there deletes the line) */
  .pqty .pdel{color:#9B3B2E; order:-1; margin-right:auto}
  html[dir="ltr"] .pqty .pdel{order:9; margin-right:0; margin-left:auto}
  .sheetfoot{padding:10px 12px 12px; border-top:1px solid var(--line); background:#FBF8F2}
  .sheeterr{color:#9B3B2E; font-size:13px; font-weight:600; margin-bottom:8px}
  .sheeterr:empty{display:none}
  .sheethint{font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5}
  .sheetclear{display:block; margin:8px auto 0; background:none; border:none; color:var(--muted);
    text-decoration:underline; font:inherit; font-size:13px; cursor:pointer; padding:8px}
  /* «ورجيني كمان» — the end of the opened part of the list (25 Nov 2026) */
  .morebar{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;
    padding:18px 8px 28px; color:var(--muted); font-size:13.5px;
    overflow-anchor:none}   /* never the scroll anchor: new cards go in above it, the page must not follow it down */
  .morebar span{flex-basis:100%; text-align:center}
  .morebar button{min-height:46px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    color:#8A5A1C; font:inherit; font-size:14.5px; font-weight:700; padding:8px 18px; cursor:pointer}
  .morebar .mnext{border:none; color:#211505; background:linear-gradient(180deg,#F09A22,var(--amber));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .listend{text-align:center; color:var(--muted); font-size:13px; padding:16px 8px 24px}
  /* «⬇ تصدير» — the selection as a file (25 Nov 2026) */
  .trayex{flex:0 0 auto; height:44px; border-radius:12px; border:1px solid rgba(232,135,11,.55);
    background:var(--chrome); color:var(--amber); font:inherit; font-size:14px; font-weight:700;
    padding:0 12px; cursor:pointer; white-space:nowrap}
  .sheetex{display:block; width:100%; margin-top:10px; min-height:44px; border-radius:12px; border:1px solid var(--line);
    background:#fff; color:#8A5A1C; font:inherit; font-size:14px; font-weight:700; cursor:pointer}
  .exbody{padding:12px 14px 14px; overflow-y:auto}
  .exopt{display:flex; align-items:flex-start; gap:12px; padding:12px; margin-bottom:8px; border:1px solid var(--line);
    border-radius:12px; background:#fff; cursor:pointer}
  .exopt input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--amber); flex:0 0 auto}
  .exopt span{display:flex; flex-direction:column; gap:2px; font-size:15px}
  .exopt small{font-size:12.5px; color:var(--muted)}
  .exsafe{font-size:12.5px; color:var(--muted); margin:4px 2px 12px}
  .exbtns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .exgo{min-height:52px; border-radius:12px; border:none; cursor:pointer; font:inherit; font-size:15.5px; font-weight:700;
    color:#211505; background:linear-gradient(180deg,#F09A22,var(--amber)); box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .exgo:disabled,.sheetclear:disabled{opacity:.5; cursor:progress}
  .exmsg{font-size:13px; color:#3E6B2C; font-weight:600; margin-top:10px; line-height:1.5; word-break:break-word; white-space:pre-line}
  .exmsg:empty{display:none}
  .exmsg.bad{color:#9B3B2E}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="wordmark">LIGHTWARE<span class="dot">.</span></span>
    <span style="display:flex;align-items:center;gap:10px">
      <a class="authbtn" id="auditbtn" href="audit.html" hidden style="text-decoration:none">📋</a>
      <a class="authbtn" id="reorderbtn" href="reorder.html" hidden style="text-decoration:none">📦</a>
      <button class="authbtn" id="langbtn">EN</button>
      <button class="authbtn" id="authbtn">🔒</button>
    </span>
  </div>
  <div class="sync" id="sync">…</div>
</header>

<!-- team login — unlocks the cost column (authenticated-only in Supabase) -->
<div class="lightbox" id="authbox">
  <div class="authcard" onclick="event.stopPropagation()">
    <div style="font-weight:700;margin-bottom:10px" id="auth-title"></div>
    <input id="auth-email" type="email" dir="ltr" autocomplete="username">
    <input id="auth-pass" type="password" dir="ltr" autocomplete="current-password">
    <div class="autherr" id="auth-err"></div>
    <button class="authgo" id="auth-go"></button>
  </div>
</div>

<div class="searchwrap">
  <input id="search" type="search" placeholder="ابحث بالكود أو الاسم…" autocomplete="off">
</div>

<div class="filterbar">
  <div class="custom-select-wrapper" id="brand-wrapper">
    <div class="custom-select-trigger" tabindex="0" id="brand-trigger">كل الماركات</div>
    <div class="custom-options" id="brand-options">
      </div>
  </div>
  <button class="sortpill" id="sortpill" title="ترتيب حسب الكمية">⇅ ترتيب</button>
</div>

<div class="chips" id="chips"></div>

<main>
  <div class="countrow"><div class="count" id="count"></div><button class="selall" id="selall" hidden></button></div>
  <div id="list"><div class="state">عم نحمّل البيانات…</div></div>
</main>

<!-- «اختار ← نقلة / عرض سعر / مساطر» — team login only (see the PICK block in the script) -->
<div id="tray" hidden><div class="trayin" id="trayin"></div></div>
<div class="sheetwrap" id="picksheet"><div class="sheet" id="sheet"></div></div>

<div class="lightbox" id="lightbox">
  <button class="close" aria-label="إغلاق">✕</button>
  <img id="lightbox-img" alt="">
</div>

<script>

/* ==== LOCAL SUPPLIERS — mirror of order-portal/src/localsup.js ====
   ⚠ EDIT BOTH. This page has no build step and shares no module with the
   portal, so the registry is duplicated exactly as itemsearch.js is (the
   established pattern here since Jul 14 2026). `localsup-parity.mjs` extracts
   this block and asserts the two agree on every row of the live catalogue —
   run it after touching either side.

   WHAT IT IS FOR HERE: Amr's rule of 24 Sep 2026 — goods bought from a local
   Syrian supplier are bought ON ORDER and handed to the customer the same day,
   so STOCK in one of these lines is the anomaly, and the dashboard says so
   instead of listing it as ordinary inventory. */
const LOCAL_SUPPLIERS = [
  { id:"energetic", label:"Energetic", prefixes:["36"], codes:[], names:[], latin:["energetic","energitic"] },
  { id:"shami", label:"الشامي", prefixes:[],
    codes:["08030","08031","08032","0304001","0304003","0304004","0304005","0303024","0303025"],
    names:["بضاعة الشامي","محمد الشامي","الشامي"], latin:["shami"] },
  { id:"icon", label:"ايكون", prefixes:[], codes:[], names:["ايكون"], latin:["icon"] },
  { id:"shmout", label:"خالد شموط", prefixes:[], codes:["14095","14096","14097","28070"],
    names:["خالد شموط"], latin:[] },
  { id:"ghani", label:"عبد الغني عثمان", prefixes:[], codes:["0101045","0101053","0201059"],
    names:["عبد الغني عثمان","عبد الغني"], latin:[] },
  { id:"shaaban", label:"هاني شعبان", prefixes:[], codes:["0305001"], names:["هاني شعبان"], latin:[] },
];
/* ⚠ Arabic names: an attached ل/و/ب is part of the match. Latin: word-bounded,
   because latin_name «T2014silicone» contains «icon» and a substring rule would
   flag a silicone strip as a supplier leak. */
const DH_MATCH = LOCAL_SUPPLIERS.map(x=>({
  id:x.id,
  prefixes:x.prefixes||[],
  codes:new Set(x.codes||[]),
  res:[...(x.names||[]).map(n=>new RegExp("[\u0644\u0648\u0628]?"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g")),
       ...(x.latin||[]).map(n=>new RegExp("\\b"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","gi"))],
}));
function dhByCode(code){
  const c = String(code||""); if(!c) return null;
  for(const m of DH_MATCH){ if(m.codes.has(c)) return m.id;
    if(m.prefixes.some(pf=>c.startsWith(pf))) return m.id; }
  return null;
}
function dhByText(text){
  const v = String(text||""); if(!v) return null;
  for(const m of DH_MATCH) if(m.res.some(re=>{re.lastIndex=0; return re.test(v)})) return m.id;
  return null;
}
const isDirectItem = i => !!(dhByCode(i&&i.code) || dhByText(i&&i.name) || dhByText(i&&i.latin_name));
function unusualStock(rows){
  const hit = (rows||[]).filter(i=>isDirectItem(i) && Number(i.qty)>0);
  let units=0, value=0, nocost=0;
  for(const i of hit){ units += Number(i.qty)||0;
    if(i.cost>0) value += Number(i.qty)*Number(i.cost); else nocost++; }
  return { rows:hit, codes:hit.length, units, value, nocost };
}
let onlyDirect = false;
let onlyMasatir = false;      // the «🪧 مساطر» chip: show only what is out on consignment
let msItems = new Map();      // code -> {qty, pend, since, holders} — team login only
/* ==== END LOCAL SUPPLIERS ==== */

/* ==== MASATIR — mirror of order-portal/src/masatir.js (foldHoldings → items) ====
   «وين المساطر» (Amr, 26 Sep 2026): a consignment is a plain مبيعات bill on the
   merchant's «… مساطر» account, so the goods leave Al-Ameen's stock the moment
   it is typed and this page could not see them. Σ sent − Σ returned per
   (account, code), every fiscal year, FIFO for the oldest piece still out;
   portal slips Qusay has not typed stay apart as `pend`. Only the ITEM view is
   mirrored — that is all a card shows. `masatir-parity.mjs` extracts this block
   and asserts it agrees with the portal module on the live books. */
const MS_isName = n => /مساطر/.test(String(n||""));
const MS_key = s => String(s||"").trim().replace(/\s+/g," ").toLowerCase();
const MS_isSale = k => /^مبيع/.test(String(k||"")) && !/مرتجع/.test(String(k||""));
const MS_isRet = k => String(k||"").startsWith("مرتجع مبيع");
const MS_r3 = x => Math.round(x*1000)/1000;
const MS_day = d => String(d||"").slice(0,10);
const MS_pending = w => !!w && (w.status==="pending" || (w.status==="flagged" && w.flag_reason!=="NEEDS_PRICE"));
function msShort(name){
  let s = String(name||"").replace(/مساطر/g," ");
  s = s.replace(/([/\\|–—-])(\s*[/\\|–—-])+/g,"$1");
  s = s.replace(/[\s/\\|–—-]+$/g,"").replace(/^[\s/\\|–—-]+/g,"");
  return s.replace(/\s{2,}/g," ").trim() || String(name||"");
}
function msFold(bills, accounts, slips){
  const EPS = 1e-6;
  const acc = new Map((accounts||[]).map(a=>[a.guid,a]));
  const byName = new Map((accounts||[]).map(a=>[MS_key(a.name),a]));
  const lots = new Map(), pend = new Map(), pendDate = new Map();
  const L = k => { if(!lots.has(k)) lots.set(k,[]); return lots.get(k); };
  const rows = (bills||[]).filter(b=>acc.has(b.customer_guid) && (MS_isSale(b.kind)||MS_isRet(b.kind)))
    .sort((a,b)=>(MS_day(a.date)<MS_day(b.date)?-1:MS_day(a.date)>MS_day(b.date)?1:0)
      || (MS_isSale(b.kind)-MS_isSale(a.kind)) || ((Number(a.no)||0)-(Number(b.no)||0)));
  for(const b of rows){
    const d = MS_day(b.date);
    for(const it of (b.items||[])){
      if(!it || !it.code) continue;
      const q = Number(it.qty||0); if(!(q>EPS)) continue;
      const ls = L(b.customer_guid+"|"+it.code);
      if(MS_isSale(b.kind)){ ls.push({date:d, qty:q}); continue; }
      let need = q;                              /* FIFO: the oldest piece comes back first */
      while(need>EPS && ls.length){
        const take = Math.min(ls[0].qty, need);
        ls[0].qty -= take; need -= take;
        if(ls[0].qty<=EPS) ls.shift();
      }
    }
  }
  for(const w of (slips||[])){
    if(!w || w.status==="voided") continue;
    const a = byName.get(MS_key(w.customer));
    if(!a || !MS_pending(w) || (w.kind!=="consign" && w.kind!=="return")) continue;
    const sg = w.kind==="consign" ? 1 : -1;
    for(const it of (w.items||[])){
      const q = Number(it.qty||0);
      if(!it.code || String(it.code).startsWith("EXT-") || !(q>EPS)) continue;
      const k = a.guid+"|"+it.code;
      pend.set(k, (pend.get(k)||0) + sg*q);
      const d = MS_day(w.created_at);
      if(!pendDate.has(k) || d<pendDate.get(k)) pendDate.set(k,d);
    }
  }
  const items = new Map();
  for(const k of new Set([...lots.keys(), ...pend.keys()])){
    const [g, code] = k.split("|");
    const a = acc.get(g); if(!a) continue;
    const ls = lots.get(k)||[];
    const qty = MS_r3(ls.reduce((s,l)=>s+l.qty,0));
    const p = MS_r3(pend.get(k)||0);
    if(qty<=EPS && Math.abs(p)<=EPS) continue;
    const since = ls.length ? ls[0].date : (p>0 ? pendDate.get(k) : null);
    if(!items.has(code)) items.set(code, {code, qty:0, pend:0, since:null, holders:[]});
    const it = items.get(code);
    it.qty = MS_r3(it.qty+qty); it.pend = MS_r3(it.pend+p);
    if(since && (!it.since || since<it.since)) it.since = since;
    it.holders.push({guid:g, name:a.name, qty, pend:p, since});
  }
  for(const it of items.values()) it.holders.sort((x,y)=>(y.qty+y.pend)-(x.qty+x.pend)
    || String(x.since||"9").localeCompare(String(y.since||"9")) || String(x.guid).localeCompare(String(y.guid)));
  return items;
}
/* ==== END MASATIR ==== */

/* team-only, quiet on any failure: customers and bills are authenticated
   tables, and a consignment line is garnish on a stock card, never a blocker */
async function fetchMasatir(){
  const tk = await getToken();
  if(!tk) return;
  try{
    const accounts = await restPages(`customers?select=guid,name&name=like.${encodeURIComponent("*مساطر*")}`, tk);
    const mine = accounts.filter(a=>MS_isName(a.name));
    if(!mine.length){ msItems = new Map(); return; }
    const inl = `in.(${mine.map(a=>a.guid).join(",")})`;
    const cols = "no,date,kind,customer_guid,items";
    const [b26, b25, slips] = await Promise.all([
      restPages(`alameen_bills?select=${cols}&customer_guid=${inl}`, tk),
      restPages(`alameen_bills_2025?select=${cols}&customer_guid=${inl}`, tk).catch(()=>[]),
      restPages("withdrawals?select=no,kind,status,flag_reason,customer,created_at,items&kind=in.(consign,return)&status=neq.voided", tk).catch(()=>[]),
    ]);
    msItems = msFold([...b26, ...b25], mine, slips);
  }catch(e){ /* the stock cards still tell their own story */ }
}
function masatirLineHtml(i){
  const m = msItems.get(i.code);
  if(!m) return "";
  const n = fmtStoreQty(m.qty + m.pend);
  if(!(n > 0)) return "";
  const hs = m.holders.slice(0,3).map(h=>
    `<span class="storetag">${escHtml(msShort(h.name))} <b>${fmtStoreQty(h.qty+h.pend)}</b></span>`).join("");
  const more = m.holders.length>3 ? `<span class="storetag">+${m.holders.length-3}</span>` : "";
  const pend = m.pend ? `<span class="storetag">${escHtml(t("ms_pend")(fmtStoreQty(m.pend)))}</span>` : "";
  return `<div class="stores mstags"><span class="storetag mstag">${t("ms_tag")} <b>${n}</b></span>${hs}${more}${pend}</div>`;

function savedAuth(){

let refreshing = null;   // the ONE in-flight refresh, shared by concurrent callers
async function getToken(){
  const a = savedAuth();
  if(!a) return null;
  if(a.expires_at*1000 > Date.now()+60000) return a.access_token;
  // expired -> refresh (vanilla GoTrue REST, no library). The three loaders
  // below now run side by side; refresh tokens ROTATE, so three parallel
  // refreshes would race and the losers would sign the person out.
  if(!refreshing) refreshing = refreshAuth(a).finally(()=>{ refreshing = null; });
  return refreshing;
}
async function refreshAuth(a){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:"POST", headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},

/* ⚠ PAGING (Sep 23 2026): offset/limit query params — NEVER the Range header.
   Chrome turns a request carrying a Range header into `accept-encoding:
   identity`, so every catalogue page arrived UNCOMPRESSED: 311 KB instead of
   47 KB per 1,000 rows, measured on this table (the storefront paid the same
   bill on Sep 20). The first page asks for the exact count and the remaining
   pages are fetched at once — from Damascus a round trip to Supabase costs
   about a second whatever its size, so three pages in a row were three seconds
   before the first card. `expectRows` is only a hint of how many pages to
   ask for at once; a full last page keeps walking, so a row that lands between
   the count and the pages is never dropped, and a missing count header falls
   back to walking the pages one by one — never to a truncated list. */
async function restPages(path, bearer, expectRows){
  const PAGE = 1000;
  const sep = path.includes("?") ? "&" : "?";
  const H = { apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${bearer}` };
  const get = async (from, extra)=>{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}${sep}offset=${from}&limit=${PAGE}`,
      { headers:{ ...H, ...(extra||{}) } });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return { rows: await r.json(), total: Number((r.headers.get("content-range")||"").split("/")[1]) };
  };
  // every page the caller EXPECTS goes out in one burst — the count on the
  // first page only decides whether more exist. A page past the end comes
  // back as [] (probed: 200, not 416), so a hint that is too high costs one
  // cheap parallel request and a hint that is too low costs one more round.
  const guess = Math.max(1, Math.ceil((expectRows || 0) / PAGE));
  const burst = await Promise.all(
    Array.from({length: guess}, (_,i)=> get(PAGE*i, i===0 ? { Prefer:"count=exact" } : undefined)));
  const out = [];
  let from = 0, lastLen = PAGE;
  for(const p of burst){ out.push(...p.rows); from += PAGE; lastLen = p.rows.length; }
  if(lastLen < PAGE) return out;
  const total = burst[0].total;
  if(Number.isFinite(total) && total > from){
    const pages = await Promise.all(
      Array.from({length: Math.ceil((total-from)/PAGE)}, (_,i)=> get(from + PAGE*i)));
    for(const p of pages){ out.push(...p.rows); from += PAGE; lastLen = p.rows.length; }
    if(lastLen < PAGE) return out;
  }
  // no usable count (a proxy stripped the header) — walk on, never truncate
  for(;;from+=PAGE){ const p = await get(from); out.push(...p.rows); if(p.rows.length < PAGE) break; }
  return out;
}

// (qty × cost; Samir, 16 Oct 2026 — it was biggest pile first) — before the
// 0s/negatives. ⚠ `cost` is a team-only column: a row without one has no value
// to rank by and none is guessed — unvalued rows follow the valued ones,
// biggest pile first, so signed out (no cost anywhere) the order is by quantity.
function stockValue(i){
  return i.qty > 0 && i.cost > 0 ? Number(i.qty) * Number(i.cost) : null;
}
function untrackedRank(a,b){
  const aPos = a.qty > 0, bPos = b.qty > 0;
  if(aPos !== bPos) return aPos ? -1 : 1;   // positive stock before zero/negative
  if(aPos){
    const av = stockValue(a), bv = stockValue(b);
    if((av!=null) !== (bv!=null)) return av!=null ? -1 : 1;   // valued before unvalued
    if(av!=null && bv!==av) return bv - av;  // both valued -> most money first
    return b.qty - a.qty;                    // tie / both unvalued -> highest qty first
  }

/* ================== search engine (mirror of order-portal/src/itemsearch.js —

const AR_DIGITS = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
function normText(s){
  if(!s) return "";
  let t = String(s).toLowerCase()
    .replace(/[٠-٩۰-۹]/g, d => AR_DIGITS[d] || d)
    .replace(/[ً-ْـ]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه")
    .replace(/[ىئ]/g,"ي").replace(/ؤ/g,"و").replace(/ء/g,"");
  return t.replace(/[^0-9a-z؀-ۿ]+/g," ").trim();
}
const AR_MAP = {"ب":"b","ت":"t","ث":"t","ج":"j","ح":"h","خ":"k","د":"d","ذ":"z","ر":"r","ز":"z","س":"s","ش":"s","ص":"s","ض":"d","ط":"t","ظ":"z","غ":"g","ف":"f","ق":"k","ك":"k","ل":"l","م":"m","ن":"n","ه":"h"};
/* «Arabizi» digits — only BETWEEN two Latin letters. A leading/trailing digit
   belongs to a code or spec ("1507","120led") and must stay a digit. */
const ARABIZI = {"2":"","3":"","4":"z","5":"k","6":"t","7":"h","8":"g","9":"k"};
function skeleton(word){
  if(/[؀-ۿ]/.test(word)){
    let out = "";
    for(const ch of word){ const m = AR_MAP[ch]; if(m && m !== out[out.length-1]) out += m; }
    return out;
  }
  let t = word
    .replace(/(?<=[a-z])[2-9](?=[a-z])/g, d => ARABIZI[d] ?? d)
    .replace(/kh/g,"k").replace(/sh/g,"s").replace(/ch/g,"s")
    .replace(/th/g,"t").replace(/dh/g,"z").replace(/gh/g,"g")
    .replace(/ph/g,"f").replace(/q/g,"k").replace(/c/g,"k")
    .replace(/p/g,"b").replace(/v/g,"f")
    .replace(/[aeiouwy]/g,"")
    .replace(/[^a-z]/g,"");

  for(const ch of t) if(ch !== out[out.length-1]) out += ch;

function within(a,b,k){
  if(Math.abs(a.length-b.length) > k) return false;
  let prev = Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const row=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      row[j]=Math.min(prev[j]+1,row[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(row[j]<best) best=row[j];
    }
    if(best>k) return false;
    prev=row;
  }
  return prev[b.length]<=k;
}
/* Curated category bridge — normalized forms only. Translation table, not a

  ["floodlight","projector","كشاف","kashaf","kashef"],
  ["panel","بلافونه","بانل","blafone","plafone"],["track","سكه","sekke","seke"],
  ["magnetic","magnet","مغناطيس","meghnatis","maghnatees"],["stand","ستاند"],
  ["lantern","فانوس","fanous","fanos"],["crystal","كريستال","kristal"],

  // warm/daylight, while other items carry 3000K/4000K — neither could find
  // the other, and together they are a fifth of all sale-bill lines.
  ["شمسي","shamsi","warm","3000k"],["النهار","daylight","4000k"],
  ["ابيض","white","abyad"],["اسود","black","aswad"],
  ["ذهبي","gold","golden","dahabi"],["كروم","chrome","krom"],

  ["driver","درايفر","محول","mhawel","muhawil","طرانس","ترانس","طرنس","trans","transformer","tarans"],

function skeletonsOf(word){

  if(/^ال./.test(word)) out.push(skeleton(word.slice(2)));

const SYN = new Map();

function wordScore(tok,w,digitTok){

  return 0;

    else if(ts.length>=3 && item._skels.some(s=>s.includes(ts))) best = 25;

function itemScore(item,tokens){
  let sum = 0;
  for(const tok of tokens){
    const s = tokenScore(item,tok);
    if(!s) return 0;                         // every token must land somewhere
    sum += s;
  }
  return sum;
}
function rankSearch(pool,q,tiebreak){
  const nq = normText(q);
  if(!nq) return [];
  const tokens = nq.split(" ");
  const codeq = nq.replace(/ /g,"");
  const collect = (tokenSets)=>{
    const hits = [];
    for(const i of pool){
      let sc = 0;
      for(const ts of tokenSets){ const s = itemScore(i,ts); if(s>sc) sc = s; }
      if(!sc) continue;
      if(i.code.startsWith(codeq)) sc += 1000;
      hits.push([sc,i]);
    }
    hits.sort((a,b)=>(b[0]-a[0])||tiebreak(a[1],b[1]));
    return hits.map(h=>h[1]);
  };
  const full = collect([tokens]);
  if(full.length || tokens.length<2) return full;
  // no item carries every word — degrade once to all-but-one so the user
  // still lands near what they meant instead of a dead "no results"
  return collect(tokens.map((_,k)=>tokens.filter((_,j)=>j!==k)));
}
/* ================== end search engine ================== */

function encodePick(kind, entries){
  const bytes = new TextEncoder().encode(JSON.stringify({ v:1, k:kind, i:entries, t:Date.now() }));
  let bin = ""; for(const x of bytes) bin += String.fromCharCode(x);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function sendPick(kind){
  if(!PICK_KINDS.includes(kind) || !picks.size) return;
  // ⚠ MIRROR of whpick.js WH_MAX_LINES — the portal refuses a longer link whole. EDIT BOTH.
  if(picks.size > PICK_MAX_SEND){ openSheet(); renderSheet(t("pk_toomany")(fmtN(picks.size), fmtN(PICK_MAX_SEND))); return; }
  // a quantity that is not a positive number stops the send, by NAME — never read as 1
  pickBad = new Set([...picks].filter(([,q])=>!(parseQty(q) > 0)).map(([c])=>c));
  if(pickBad.size){
    const names = [...pickBad].map(c=>{ const i = itemsByCode.get(c); return i ? (i.name||i.latin_name||c) : c; });
    openSheet(); renderSheet(t("pk_badqty")(names.join("، ")));
    return;
  }
  const entries = [...picks].map(([c,q])=>[c, parseQty(q)]);
  try{ localStorage.setItem(PICK_SENT_KEY, JSON.stringify({ at:Date.now(), kind, picks:[...picks] })); }catch{}
  picks.clear(); savePicks(); saveState();
  location.assign(PORTAL_URL + "#wh=" + encodePick(kind, entries));
}

  const subtitle = [d.n(fmtN(lines.length)), day].concat(o.internal ? [d.synced(exSync()), d.internal] : [`${d.contact} ${SALES_WA} · lightwaresy.com`]).join("  ·  ");
  const rows = [
    [{ v:`LIGHTWARE.  ${d.title}`, s:S.title }],
    [{ v:subtitle, s:S.sub }],
    cols.map(([k])=>({ v:d[k], s:S.hdr })),
    ...lines.map(l=> cols.map(([k])=>{
      if(k==="num") return { v:l.n, s:S.cen };
      if(k==="code") return { v:l.code, s:S.code };            // text: «0101068» keeps its zero
      if(k==="qty") return { v:l.qty, s:S.num };
      if(k==="stock") return l.stock==null ? { v:"—", s:S.stock } : { v:l.stock, s:S.stock };
      return { v:l[k] || "", s: k==="unit" ? S.cen : S.txt };
    })),
    [{ v:d.total(fmtN(lines.length)), s:S.tot }, ...cols.slice(1).map(()=>({ v:"", s:S.totX }))],
  ];
  return eng.xlsx([{ name:d.sheet, rtl, cols:cols.map(c=>c[1]), rows,
    merges:[`A1:${last}1`, `A2:${last}2`, `A${end+1}:${last}${end+1}`], freeze:"A4",
    filter:`A3:${last}${end}`, heights:{ 1:28, 2:22, 3:30 } }]);
}

/* ---------- the PDF: canvas pages (Arabic shapes natively) → JPEG → the house packer ---------- */
const XP = { W:1240, H:1754, M:64, FONT:'-apple-system,"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif',
  ink:"#1C1813", sub:"#5C5344", faint:"#8A7F6A", amber:"#E8870B", amberBg:"#FBE9CE", line:"#E2D8C3", cream:"#F6F1E7",
  zebra:"#FCFAF5", red:"#9E2B14" };
function exImages(lines, onProg){
  const urls = [...new Set(lines.map(l=>l.img).filter(Boolean))], out = new Map();
  let done = 0, next = 0;
  const one = (u)=> new Promise(res=>{
    const img = new Image(); let fin = false;
    const end = (ok)=>{ if(fin) return; fin = true; clearTimeout(tm); out.set(u, ok ? img : null); onProg(++done, urls.length); res(); };
    const tm = setTimeout(()=> end(false), 15000);
    img.crossOrigin = "anonymous";      // the storage answers «*»: the canvas stays exportable
    img.onload = ()=> end(img.naturalWidth > 0); img.onerror = ()=> end(false);
    img.src = u;
  });
  const worker = async ()=>{ while(next < urls.length) await one(urls[next++]); };
  onProg(0, urls.length);
  return Promise.all(Array.from({ length: Math.min(6, urls.length) }, worker)).then(()=> out);
}
async function exPdf(eng, lines, o, d, day){
  const rtl = lang === "ar", { W, H, M } = XP, RH = o.internal ? 138 : 118;   // the warehouse line needs its own row
  const pos = (dd)=> rtl ? W - dd : dd;                 // distance from the START edge → x
  const SA = rtl ? "right" : "left", EA = rtl ? "left" : "right";
  const T = (x, s, px, py, op = {})=>{ x.save(); x.font = `${op.bold?"bold ":""}${op.size||17}px ${XP.FONT}`;
    x.fillStyle = op.color || XP.ink; x.textAlign = op.align || SA; x.direction = op.dir || (op.ltr ? "ltr" : (rtl ? "rtl" : "ltr"));
    x.textBaseline = "middle"; x.fillText(String(s), px, py); x.restore(); };
  const width = (x, s, size, bold)=>{ x.save(); x.font = `${bold?"bold ":""}${size}px ${XP.FONT}`; const w = x.measureText(String(s)).width; x.restore(); return w; };
  const fit = (x, s, maxW, size, bold)=>{ let str = String(s); if(width(x,str,size,bold) <= maxW) return str;
    while(str.length > 1 && width(x, str+"…", size, bold) > maxW) str = str.slice(0,-1); return str + "…"; };
  const wrap2 = (x, s, maxW, size)=>{ const words = String(s).split(/\s+/).filter(Boolean); const out = []; let cur = "";
    for(const w of words){ const tt = cur ? cur+" "+w : w;
      if(width(x,tt,size,true) <= maxW || !cur){ cur = tt; continue; }
      out.push(cur); cur = w; }
    if(cur) out.push(cur);
    return out.length <= 2 ? out.map(l=>fit(x,l,maxW,size,true)) : [out[0], fit(x, out.slice(1).join(" "), maxW, size, true)]; };
  // Al-Ameen names are Arabic-first with Latin and digits inside («حبل ليد مباشر 3000K»): drawn in the
  // English page's direction they come out «3000 حبل ليد مباشرK». Each takes the direction of its first letter.
  const fsDir = (s)=>{ const m = /[A-Za-z\u00C0-\u024F\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/.exec(String(s));
    return m && /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/.test(m[0]) ? "rtl" : "ltr"; };
  const imgs = await exImages(lines, (a,n)=> exMsg(t("ex_imgs")(a,n)));
  let missing = 0;
  // columns from the END edge: qty, then stock
  const qtyW = o.qty ? 150 : 0, stW = o.internal ? 150 : 0;
  const textD = M + 44 + 112, textW = W - M - qtyW - stW - 24 - textD;
  const pages = [];
  let cv, x, y;
  const colHead = ()=>{
    x.fillStyle = XP.amber; x.fillRect(M, y, W - 2*M, 36);
    T(x, d.num, pos(M+22), y+18, { bold:true, size:14, color:"#fff", align:"center" });
    T(x, d.name, pos(textD), y+18, { bold:true, size:14, color:"#fff" });
    if(o.internal) T(x, d.stock, pos(W - M - qtyW - stW/2), y+18, { bold:true, size:14, color:"#fff", align:"center" });
    if(o.qty) T(x, d.qty, pos(W - M - qtyW/2), y+18, { bold:true, size:14, color:"#fff", align:"center" });
    y += 36;
  };
  const newPage = ()=>{
    cv = document.createElement("canvas"); cv.width = W; cv.height = H; x = cv.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, W, H); pages.push(cv);
    y = M + 70;
    if(pages.length === 1){
      T(x, d.title, pos(M), y + 10, { bold:true, size:34 });
      const sub = [d.n(fmtN(lines.length)), LRI(day)].concat(o.internal ? [d.synced(LRI(exSync()))] : []).join("  ·  ");
      T(x, sub, pos(M), y + 56, { size:16, color:XP.sub });
      if(o.internal) T(x, d.internal, pos(M), y + 88, { bold:true, size:15, color:XP.red });
      y += o.internal ? 112 : 84;
      x.fillStyle = XP.ink; x.fillRect(M, y, W - 2*M, 3); y += 18;
    }
    colHead();
  };
  newPage();
  for(const l of lines){
    if(y + RH > H - M - 46) newPage();
    if(l.n % 2 === 0){ x.fillStyle = XP.zebra; x.fillRect(M, y, W - 2*M, RH); }
    x.fillStyle = XP.line; x.fillRect(M, y + RH - 1, W - 2*M, 1);
    T(x, String(l.n), pos(M+22), y + RH/2, { size:14, color:XP.faint, align:"center", ltr:true });
    // the picture, contained in a cream tile
    const bx = rtl ? W - (M + 44) - 100 : M + 44, by = y + 9;
    x.fillStyle = XP.cream; if(x.roundRect){ x.beginPath(); x.roundRect(bx, by, 100, 100, 10); x.fill(); } else x.fillRect(bx, by, 100, 100);
    const im = l.img ? imgs.get(l.img) : null;
    if(im){ const s = Math.min(88 / im.naturalWidth, 88 / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s;
      x.drawImage(im, bx + (100 - w)/2, by + (100 - h)/2, w, h); }
    else { if(l.img) missing++; T(x, d.noimg, bx + 50, by + 50, { size:12, color:XP.faint, align:"center" }); }
    // brand · name (2 lines) · code · reference
    let ty = y + 22;
    if(l.brand){ T(x, fit(x, l.brand.toUpperCase(), textW, 12, true), pos(textD), ty, { bold:true, size:12, color:"#B86A06", dir:fsDir(l.brand) }); }
    ty += 22;
    const nm = wrap2(x, l.name, textW, 18);
    const nd = fsDir(l.name);
    nm.forEach((s, k)=> T(x, s, pos(textD), ty + k*24, { bold:true, size:18, dir:nd }));
    ty += nm.length * 24 + 2;
    const cw = width(x, l.code, 14, true);
    T(x, l.code, pos(textD), ty, { bold:true, size:14, color:XP.sub, ltr:true, align:SA });
    // the dot sits between the code and the reference, on whichever side the code is
    if(l.ref){ const r = fit(x, l.ref, textW - cw - 24, 14);
      T(x, rtl ? r + "  ·" : "·  " + r, pos(textD + cw + 10), ty, { size:14, color:XP.faint, ltr:true, align:SA }); }
    if(o.internal && l.stores){ T(x, fit(x, `${d.stores}: \u2068${l.stores}\u2069`, textW, 13), pos(textD), y + RH - 18, { size:13, color:XP.sub }); }
    if(o.internal){ const c = pos(W - M - qtyW - stW/2);
      T(x, l.stock==null ? "—" : fmtStoreQty(l.stock), c, y + RH/2 - 8, { bold:true, size:22, color:XP.sub, align:"center", ltr:true });
      if(l.unit) T(x, l.unit, c, y + RH/2 + 20, { size:13, color:XP.faint, align:"center", dir:fsDir(l.unit) }); }
    if(o.qty){ const c = pos(W - M - qtyW/2);
      x.fillStyle = XP.amberBg; x.fillRect(c - 58, y + 16, 116, RH - 32);
      T(x, fmtPickQty(l.qty), c, y + RH/2 - 8, { bold:true, size:26, align:"center", ltr:true });
      if(l.unit) T(x, l.unit, c, y + RH/2 + 22, { size:13, color:XP.sub, align:"center", dir:fsDir(l.unit) }); }
    y += RH;
  }
  exMsg(t("ex_pages")(pages.length));
  pages.forEach((p, k)=>{ const c = p.getContext("2d");
    // the house mark at the start edge, the page count at the end edge, the footer line
    // the house mark: light letterspaced caps, the amber period attached (brand/logo)
    c.save(); c.font = `300 26px ${XP.FONT}`; c.textBaseline = "middle"; c.direction = "ltr"; c.textAlign = "left";
    const ls = "letterSpacing" in c ? 5 : 0; if(ls) c.letterSpacing = ls + "px";
    const ww = c.measureText("LIGHTWARE").width - ls;
    c.save(); c.font = `bold 28px ${XP.FONT}`; const dw = c.measureText(".").width; c.restore();
    const x0 = rtl ? W - M - dw - ww - 2 : M;
    c.fillStyle = XP.ink; c.fillText("LIGHTWARE", x0, M + 10); c.restore();
    T(c, ".", x0 + ww + 2, M + 10, { bold:true, size:28, color:XP.amber, ltr:true, align:"left" });
    T(c, k ? `${d.title} · ${d.cont}` : LRI(day), pos(W - M), M + 10, { size:14, color:XP.faint, align:EA });
    c.fillStyle = XP.line; c.fillRect(M, H - M - 30, W - 2*M, 1);
    T(c, `${k+1} / ${pages.length}`, pos(W - M), H - M - 8, { size:13, color:XP.faint, align:EA, ltr:true });
    T(c, o.internal ? d.internal : `${d.contact} ${LRI(SALES_WA)} · lightwaresy.com`, pos(M), H - M - 8,
      { size:13, color: o.internal ? XP.red : XP.faint, bold: o.internal });
  });
  const jpegs = [];
  for(const p of pages){ const b = await new Promise(r=> p.toBlob(r, "image/jpeg", 0.88)); jpegs.push(await b.arrayBuffer()); }
  return { bytes: eng.packPdf(jpegs, pages.map(p=>({ w:p.width, h:p.height }))), missing };
}
/* ==== END PICK ==== */

/* the unusual-stock alert. Rendered from render() so it follows the language
   flip and the toggle with no second code path; a banner that only ever
   appeared at boot would go stale the moment someone switched to English. */
function renderDirectWarn(){
  let el = document.getElementById("directwarn");
  const u = unusualStock(items);
  if(!u.codes){ if(el) el.remove(); onlyDirect = false; return u; }
  if(!el){
    el = document.createElement("div");
    el.id = "directwarn";
    el.style.cssText = "background:#5a3c0a;color:#ffe8c2;padding:10px 14px;border-radius:10px;"+
      "margin:10px 12px 0;font-size:14px;line-height:1.5;cursor:pointer;font-weight:600";
    el.onclick = ()=>{ onlyDirect = !onlyDirect; render(); };
    const list = document.getElementById("list");
    list.parentNode.insertBefore(el, list);
  }
  /* ⚠ the value only exists for a SIGNED-IN viewer — `cost` is an authenticated
     column. Signed out, every row is unvalued, and printing «20 unvalued» would
     be noise dressed as a finding. The count and the units are the alert; the
     money is the detail, and «N unvalued» is only worth saying when the rest
     DID have a cost. */
  const val = u.value > 0
    ? t("dh_val")(u.value.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}))
      + (u.nocost ? t("dh_nocost")(u.nocost) : "")
    : "";
  el.textContent = onlyDirect
    ? t("dh_only")(u.codes)
    : t("dh_warn")(u.codes, fmtQty(u.units), val) + "  " + t("dh_show");
  return u;
}

function render(){
  const list = document.getElementById("list");
  const q = query.trim();
  let rows = items;
  renderDirectWarn();
  // ⚠ the SAME predicate the banner counts with — `isDirectItem` alone also
  // matches the 46 declared codes sitting at zero, which are exactly the ones
  // behaving correctly. A banner saying 20 that opens a list of 66 is the
  // two-numbers-for-one-list defect this app has paid for before.
  if(onlyDirect) rows = rows.filter(i=>isDirectItem(i) && Number(i.qty)>0);
  // the SAME test the chip counts with — two numbers for one list is a bug
  if(onlyMasatir) rows = rows.filter(i=>msTot(i)>0);
  if(activeFilter!=="ALL") rows = rows.filter(i=>i.status===activeFilter);
  if(activeBrand!=="ALL")  rows = rows.filter(i=>(i.brand||"")===activeBrand);
  if(q) rows = rankSearch(rows, q, severityCmp);   // relevance bands, severity inside
  if(sortMode!=="default")                          // explicit qty sort beats everything
    rows = [...rows].sort((a,b)=> sortMode==="qty_desc" ? b.qty-a.qty : a.qty-b.qty);
  else if(onlyMasatir && !q)                        // most out on consignment first
    rows = [...rows].sort((a,b)=> msTot(b)-msTot(a));
  /* a new search / filter / sort starts again at the first chunk; anything else that
     re-renders (the language flip, a toggle) keeps the cards already opened */
  const key = viewKey();
  if(key !== viewKeyLast){
    // …and from the top: left parked at card 600 over a list that just got shorter, the
    // end of it would sit in view and pull in chunk after chunk (found by export-verify X.12)
    if(viewKeyLast !== null && window.scrollY > 0) window.scrollTo(0, 0);
    shownN = PAGE_N; viewKeyLast = key;
  }
  viewRows = rows;
  shownN = Math.min(Math.max(shownN, PAGE_N), Math.max(rows.length, PAGE_N));
  shownRows = rows.slice(0, shownN);
  saveState();
  document.getElementById("count").textContent = t("count")(rows.length);
  if(!rows.length){
    list.innerHTML = `<div class="state">${t("no_results")}</div>`;
    syncPickMarks(); renderTray(); watchMore();
    return;
  }
  const team = teamOn();
  list.innerHTML = shownRows.map(i=>cardHtml(i, team)).join("") + moreHtml();
  wireMore(); syncPickMarks(); renderTray(); watchMore();
}

/* ---------- «ورجيني كمان»: the list opens 200 at a time (Samir, 25 Nov 2026) ----------
   It used to stop at 400 cards with «ضيّق البحث لتشوفن». Now the next 200 arrive by
   themselves as the end of the list comes near (IntersectionObserver), with the bar's two
   buttons as the plain way to ask — «⬇ ورجيني 200 كمان» and «عرض الكل». New cards are
   APPENDED: the cards already on screen, their pictures and the scroll stay as they are.
   The count opened is kept with the session (lw_dash_state_v1 `n`), so coming back from
   WhatsApp lands on the same card, not on card 200. */
const PAGE_N = 200;
let viewRows = [], shownN = PAGE_N, viewKeyLast = null, moreIO = null;
const viewKey = ()=> JSON.stringify([query.trim(), activeBrand, activeFilter, sortMode, !!onlyMasatir, !!onlyDirect]);
function moreHtml(){
  const n = viewRows.length, rest = n - shownN;
  if(rest > 0) return `<div class="morebar" id="morebar"><span>${t("shown_of")(fmtN(shownN), fmtN(n))}</span>
      <button type="button" class="mnext" id="more-next">${t("more_next")(fmtN(Math.min(PAGE_N, rest)))}</button>
      ${rest > PAGE_N ? `<button type="button" id="more-all">${t("more_all")(fmtN(n))}</button>` : ""}</div>`;
  return n > PAGE_N ? `<div class="listend">${t("list_end")(fmtN(n))}</div>` : "";
}
function wireMore(){
  const a = document.getElementById("more-next"), b = document.getElementById("more-all");
  if(a) a.onclick = ()=> showMore(PAGE_N);
  if(b) b.onclick = ()=> showMore(viewRows.length);
}
function showMore(k){
  const bar = document.getElementById("morebar");
  if(!bar || shownN >= viewRows.length) return;
  const from = shownN, team = teamOn();
  shownN = Math.min(viewRows.length, shownN + k);
  shownRows = viewRows.slice(0, shownN);
  bar.insertAdjacentHTML("beforebegin", viewRows.slice(from, shownN).map(i=>cardHtml(i, team)).join(""));
  bar.insertAdjacentHTML("afterend", moreHtml());
  bar.remove();
  wireMore(); syncPickMarks(); saveState(); watchMore();
}
function watchMore(){
  if(!("IntersectionObserver" in window)) return;     // the buttons still work
  if(!moreIO) moreIO = new IntersectionObserver(es=>{
    if(es.some(e=>e.isIntersecting)) showMore(PAGE_N);
  }, { rootMargin:"0px 0px 900px 0px" });
  moreIO.disconnect();
  const bar = document.getElementById("morebar");
  if(bar) moreIO.observe(bar);
}
const fmtN = n => Number(n).toLocaleString("en-US");

function cardHtml(i, team){
  return `
    <div class="item ${i.status}${team && picks.has(i.code) ? " picked" : ""}" data-code="${escHtml(i.code)}">
      ${team ? `<button type="button" class="pick" aria-pressed="${picks.has(i.code)}" aria-label="${escHtml(t(picks.has(i.code)?"pk_unpick":"pk_pick"))}"><span class="ring">${picks.has(i.code)?"✓":""}</span></button>` : ""}
      ${i.image_url ? `<img class="thumb" src="${i.image_url}" loading="lazy" alt=""
                            onclick="showLightbox('${i.image_url}')" onerror="this.remove()">` : ""}
      <div class="info">
        <div class="name"><bdi>${i.name || i.latin_name || i.code}</bdi></div>
        <div class="meta">${i.code}${i.latin_name ? " · "+i.latin_name : ""}</div>
        ${packLineHtml(i)}${branchLineHtml(i)}${storeLineHtml(i)}${masatirLineHtml(i)}
      </div>
      <div class="side">
        <div class="qty">${fmtQty(i.qty)}</div>
        <div class="unit">${i.unit || ""}</div>
        <div class="tag ${i.status}">${statusLabel(i.status)}</div>
        ${i.months_cover!=null && i.status!=="UNTRACKED"
          ? `<div class="cover">${t("cover")(i.months_cover)}</div>` : ""}
        ${i.cost!=null && i.cost>0
          ? `<div class="cost">${t("cost")(usdHtml(i.cost))}</div>` : ""}
        ${i.status==="UNTRACKED" && stockValue(i)!=null      /* what the dead-stock order ranks by */
          ? `<div class="cost">${t("stock_val")(usdHtml(stockValue(i)))}</div>` : ""}
      </div>
    </div>`;
}

function msTot(i){ const m = msItems.get(i.code); return m ? m.qty + m.pend : 0; }
function renderChips(){
  const counts = {ALL: items.length};
  for(const f of FILTERS.slice(1)) counts[f] = items.filter(i=>i.status===f).length;
  const msCount = msItems.size ? items.filter(i=>msTot(i)>0).length : 0;
  if(!msCount) onlyMasatir = false;
  document.getElementById("chips").innerHTML = FILTERS.map(f=>`
    <span class="chip ${f===activeFilter?"active":""}" data-f="${f}">
      ${filterLabel(f)}<span class="n">${counts[f]}</span>
    </span>`).join("") + (msCount ? `
    <span class="chip ms ${onlyMasatir?"active":""}" id="mschip" title="${escHtml(t("ms_only")(msCount))}">
      ${t("ms_chip")}<span class="n">${msCount}</span>
    </span>` : "");
  document.querySelectorAll(".chip[data-f]").forEach(c=>c.onclick=()=>{
    activeFilter=c.dataset.f; renderChips(); render();
  });
  const mc = document.getElementById("mschip");
  if(mc) mc.onclick = ()=>{ onlyMasatir = !onlyMasatir; renderChips(); render(); };
}

function populateBrands(){
  /* daily-workflow brands first (Qusay's frequency order, Jul 14 2026),
     then the rest alphabetically — labels match dashboard_items.brand exactly */
  const BRAND_PRIORITY = ["Megaman","Lightware","LEDs C4","Energetic"];
  const brandRank = b => { const i = BRAND_PRIORITY.indexOf(b); return i === -1 ? BRAND_PRIORITY.length : i; };
  const brands = [...new Set(items.map(i=>i.brand).filter(Boolean))]
    .sort((a,b)=>brandRank(a)-brandRank(b) || a.localeCompare(b,'ar'));
  const optionsContainer = document.getElementById("brand-options");
  const trigger = document.getElementById("brand-trigger");
  const wrapper = document.getElementById("brand-wrapper");

  // Build the HTML for the options
  let html = `<div class="custom-option selected" data-value="ALL">${t("all_brands")}</div>`;
  html += brands.map(b=>`<div class="custom-option" data-value="${b}">${b}</div>`).join("");
  optionsContainer.innerHTML = html;

  // Toggle dropdown visibility when clicking the box
  trigger.onclick = () => optionsContainer.classList.toggle("open");

  // Handle clicking an option
  optionsContainer.querySelectorAll(".custom-option").forEach(opt => {
    opt.onclick = function() {
      activeBrand = this.dataset.value;
      trigger.textContent = this.textContent;
      optionsContainer.classList.remove("open");

      // Move the amber highlight to the selected option
      optionsContainer.querySelectorAll(".custom-option").forEach(o => o.classList.remove("selected"));
      this.classList.add("selected");

      render();
    };
  });

  // Close the menu if the user taps anywhere else on the screen
  document.addEventListener("click", (e) => {
    if (!wrapper.contains(e.target)) {
      optionsContainer.classList.remove("open");
    }
  });
}

/* ---------- language: paint static chrome + flip direction ----------
   Everything dynamic re-renders through t(); this handles the fixed markup.
   Called once at boot and again on every toggle — no reload, so the user
   keeps their search, filters, sort and scroll position. */
function applyLang(){
  const d = DICT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = d.title;
  document.getElementById("langbtn").textContent = d.lang_btn;
  document.getElementById("authbtn").title = d.cost_title;
  document.getElementById("auth-title").textContent = d.auth_title;
  document.getElementById("auth-email").placeholder = d.auth_email;
  document.getElementById("auth-pass").placeholder = d.auth_pass;
  document.getElementById("auth-go").textContent = d.auth_go;
  document.getElementById("search").placeholder = d.search_ph;
  document.querySelector("#lightbox .close").setAttribute("aria-label", d.close);
}

document.getElementById("langbtn").onclick = ()=>{
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem(LANG_KEY, lang); } catch { /* private mode — session only */ }
  const y = window.scrollY;
  applyLang();
  syncSortPill();
  // brand trigger: re-label only if it's still on "all" (a picked brand is a
  // data value — «Megaman» reads the same in both languages)
  const trig = document.getElementById("brand-trigger");
  if(activeBrand === "ALL") trig.textContent = DICT[lang].all_brands;
  const allOpt = document.querySelector('#brand-options .custom-option[data-value="ALL"]');
  if(allOpt) allOpt.textContent = DICT[lang].all_brands;
  const stale = document.getElementById("stalewarn");
  if(stale && stale.dataset.age) stale.textContent = DICT[lang].stale(stale.dataset.age);
  const syncEl = document.getElementById("sync");
  if(syncEl.dataset.iso){
    syncEl.textContent = DICT[lang].last_sync + " " +
      new Date(syncEl.dataset.iso).toLocaleString(DICT[lang].locale,{dateStyle:"short",timeStyle:"short"});
  }
  renderChips(); render();
  window.scrollTo(0, y);
};

/* ---------- qty sort pill ---------- */
const SORT_KEYS = {default:"sort_default", qty_desc:"sort_desc", qty_asc:"sort_asc"};
function syncSortPill(){
  const p = document.getElementById("sortpill");
  p.textContent = t(SORT_KEYS[sortMode]);
  p.title = t("sort_title");
  p.classList.toggle("active", sortMode!=="default");
}
document.getElementById("sortpill").onclick = ()=>{
  sortMode = sortMode==="default" ? "qty_desc" : sortMode==="qty_desc" ? "qty_asc" : "default";
  syncSortPill(); render();
};

(async function init(){
  applyLang();
  try{
    // the three loaders are independent — run them side by side. They used
    // to run one after another, and from Damascus every request to Supabase
    // is ~1 s of round trip whatever its size: a logged-in load waited for
    // five requests in a row before the first card (measured 23 Sep 2026).
    const [, , rows] = await Promise.all([
      fetchLocs().catch(()=>{}),        // shelf labels (team-only, quiet if absent)
      fetchBranchList().catch(()=>{}),  // branch registry (multi-branch cards, quiet if absent)
      fetchAll(),
      fetchMasatir().catch(()=>{}),     // what is out on consignment (team-only, quiet)
      fetchPacksW(),                    // pieces per package (public, quiet before the paste)
    ]);
    items = buildItemIndex(rows);
    // UNTRACKED sorts for dead-stock visibility; all other statuses keep lowest/negative-first
    items.sort(severityCmp);
    itemsByCode = new Map(items.map(i=>[i.code, i]));
    loadPicks();
    const latest = items.reduce((m,i)=> i.synced_at>m ? i.synced_at : m, "");
    if(latest){
      const d = new Date(latest);
      const syncEl = document.getElementById("sync");
      syncEl.dataset.iso = latest;
      syncEl.textContent =
        t("last_sync") + " " + d.toLocaleString(t("locale"),{dateStyle:"short",timeStyle:"short"});
      // dead-man banner: the hourly sync (Qusay's PC) failing must be VISIBLE,
      // not silent stale numbers. >3h old during business hours = something's
      // down. Overnight staleness is normal (sync sleeps 21:00→9:00) — the
      // 10:00–21:00 local-hour guard keeps mornings quiet.
      const ageH = (Date.now() - d.getTime()) / 3600000;
      const hour = new Date().getHours();
      if(ageH > 3 && hour >= 10 && hour < 21){
        const warn = document.createElement("div");
        warn.style.cssText = "background:#7a1f1f;color:#ffd9d9;padding:10px 14px;"+
          "border-radius:10px;margin:10px 12px 0;font-size:14px;text-align:center;font-weight:600";
        warn.id = "stalewarn";
        warn.dataset.age = Math.round(ageH);
        warn.textContent = t("stale")(Math.round(ageH));
        const list = document.getElementById("list");
        list.parentNode.insertBefore(warn, list);
      }
    }
    // restore the last session (search + filters + sort + scroll) BEFORE first paint
    const saved = loadState();
    if(saved){
      query = saved.q || "";
      activeFilter = FILTERS.includes(saved.status) ? saved.status : "ALL";
      sortMode = (saved.sort in SORT_KEYS) ? saved.sort : "default";
      onlyMasatir = !!saved.ms && msItems.size > 0;
      document.getElementById("search").value = query;
      syncSortPill();
    }
    populateBrands();
    if(saved && saved.brand && saved.brand!=="ALL"){
      const opt = [...document.querySelectorAll("#brand-options .custom-option")]
        .find(o=>o.dataset.value===saved.brand);
      if(opt){
        activeBrand = saved.brand;
        document.getElementById("brand-trigger").textContent = opt.textContent;
        document.querySelectorAll("#brand-options .custom-option").forEach(o=>o.classList.remove("selected"));
        opt.classList.add("selected");
      }
    }
    // the cards that were open come back too, or the saved scroll lands past the end
    if(saved && Number(saved.n) > PAGE_N){ shownN = Math.min(Number(saved.n), 100000); viewKeyLast = viewKey(); }
    renderChips(); render();
    if(saved && saved.scroll) requestAnimationFrame(()=>window.scrollTo(0, saved.scroll));
  }catch(e){
    document.getElementById("list").innerHTML =
      `<div class="state">${t("load_err")}<br><small style="direction:ltr">${e.message}</small></div>`;
  }
})();

document.getElementById("search").addEventListener("input", e=>{
  query = e.target.value; render();
});
let scrollT = null;
window.addEventListener("scroll", ()=>{
  clearTimeout(scrollT); scrollT = setTimeout(saveState, 250);
}, {passive:true});

/* ---------- team login: unlocks the cost column ---------- */
const authbox = document.getElementById("authbox");
function syncAuthBtn(){
  const inn = !!savedAuth();
  document.getElementById("authbtn").textContent = inn ? "🔓" : "🔒";
  // the reorder planner prices the order at cost — team only, like the cost column
  const rb = document.getElementById("reorderbtn");
  rb.hidden = !inn; rb.title = t("reorder_title");
  // «الجرد» (9 Sep 2026) — stock counting, shelf mapping and the exceptions list,
  // moved here from the order portal because this is the app the people who walk
  // the racks already use. Same login, same origin, no build step.
  const ab = document.getElementById("auditbtn");
  ab.hidden = !inn; ab.title = t("audit_title");
}
document.getElementById("authbtn").onclick = ()=>{
  if(savedAuth()){
    if(confirm(t("logout_confirm"))){
      localStorage.removeItem(AUTH_KEY); location.reload();
    }
    return;
  }
  authbox.classList.add("open");
  document.getElementById("auth-email").focus();
};
authbox.addEventListener("click", ()=> authbox.classList.remove("open"));
document.getElementById("auth-go").onclick = async ()=>{
  const email = document.getElementById("auth-email").value.trim();
  const pass  = document.getElementById("auth-pass").value;
  const err   = document.getElementById("auth-err");
  err.textContent = "";
  try{
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
      method:"POST", headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({email, password: pass})
    });
    if(!r.ok) throw new Error();
    localStorage.setItem(AUTH_KEY, JSON.stringify(await r.json()));
    location.reload();   // refetch with cost
  }catch{
    err.textContent = t("auth_err");
  }
};
syncAuthBtn();

/* ---------- lightbox: tap thumb to zoom, tap anywhere to close ---------- */
function showLightbox(url){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("open");
}
document.getElementById("lightbox").addEventListener("click", ()=>{
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightbox-img").src = "";
});
