<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Lightware — الجرد</title>
<!--
  «الجرد» — stock counting, shelf mapping and management exceptions.
  9 Sep 2026. MOVED HERE FROM THE ORDER PORTAL, and rebuilt, on Samir's
  instruction: «our warehouse employees have very low digital literacy and
  struggle with standard mobile interfaces». The portal is a dense four-tab
  document tool built for Qusay and Amr; the people who walk the racks use the
  warehouse app, so the work moved to them.

  ⚠ THE UX RULE THIS PAGE IS BUILT AROUND: ONE QUESTION PER SCREEN.
  No tabs, no dashboards, no side-by-side panels, nothing to scroll past to
  find the thing you need. Every screen asks exactly one thing, in words a
  person who does not use apps can read, with one obvious button to answer it.
  Counting is one ITEM per screen — a big photograph, the name, and a keypad —
  instead of a 40-row table of tiny inputs. Tap targets are ≥64px because a
  warehouse hand is not a stylus.

  ⚠ THE BLIND-COUNT RULE IS UNCHANGED AND LOAD-BEARING: the counter never sees
  the expected quantity. A count that can see the answer anchors on the screen
  instead of on the shelf. audit_engine.js's countList() carries no quantity at
  all, and no counting screen here renders one.

  ⚠ THE PIN IS GONE. The portal's per-profile PIN was retired in the same move;
  attribution here is the warehouse login itself — every count row carries the
  signed-in user's id and display name.

  ⚠ STACK WAREHOUSES (phase33, 28 Sep 2026): a warehouse with an active
  warehouse_maps row is floor-stacked and numbered 1..N. It gets its own doors —
  the morning cycle count (a daily queue the first device computes and every
  device reads), stack-first mapping, the picker's «الكومة ما فيها كفاية» flag
  and, for approvers only, the ledger. All of it lives in ONE block further down
  («STACK WAREHOUSES»); a rack warehouse, the demo login and a server without
  phase33 see this page exactly as it was. Harness: audit-harness/stack-verify.mjs.

  Ships beside index.html on warehouse.lightwaresy.com, behind the same login
  (localStorage lw_dash_auth — one sign-in serves every page). Zero
  dependencies and no build step, like the rest of this app: audit_engine.js
  carries the rules and this file carries the fetches and the screens.
-->
<style>
  :root{
    --ink:#1C1813; --paper:#F8F4EC; --amber:#E8870B; --amber-2:#F09A22;
    --card:#FFFFFF; --line:#E4DBC8; --muted:#776E5E;
    --cream:#F6F1E7; --chrome:#262019; --chrome-line:#3D352A;
    --good:#1E7A45; --good-bg:#E6F4EB; --bad:#B3261E; --bad-bg:#FBE9E7;
    --warn:#8A5A00; --warn-bg:#FDF0DA;
    --tap:64px;                 /* the floor for anything you press */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:17px/1.6 "IBM Plex Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* ── chrome ── */
  header{
    position:sticky; top:0; z-index:20; background:var(--chrome); color:#FCEDD8;
    border-bottom:1px solid var(--chrome-line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex; align-items:center; gap:10px;
  }
  .back{
    width:48px; height:48px; flex:none; border-radius:14px; border:1px solid var(--chrome-line);
    background:#31291F; color:#FCEDD8; font-size:24px; line-height:1; cursor:pointer;
  }
  .htitle{flex:1; font-size:19px; font-weight:800; text-align:center}
  .hbtn{
    min-width:48px; height:48px; padding:0 12px; border-radius:14px; font-size:15px; font-weight:700;
    border:1px solid var(--chrome-line); background:#31291F; color:#FCEDD8; cursor:pointer;
  }
  main{padding:16px 14px 32px; max-width:640px; margin:0 auto}

  /* ── the one question ── */
  .ask{font-size:24px; font-weight:800; line-height:1.35; margin:6px 0 4px}
  .ask.q{font-size:18px; margin:2px 0 6px}
  .askwhy{color:var(--muted); font-size:16px; margin:0 0 18px}

  /* ── big choice buttons: the primary interaction of the whole page ── */
  .big{
    display:flex; align-items:center; gap:14px; width:100%; min-height:var(--tap);
    padding:16px 18px; margin-bottom:12px; border-radius:18px; cursor:pointer;
    background:var(--card); border:2px solid var(--line); color:var(--ink);
    font:inherit; font-size:20px; font-weight:700; text-align:start; text-decoration:none;
  }
  .big:active{transform:scale(.985)}
  .big .ic{font-size:30px; line-height:1; flex:none}
  .big .tx{flex:1; min-width:0}
  .big .sub{display:block; font-size:14px; font-weight:600; color:var(--muted); margin-top:2px}
  .big .go{font-size:24px; color:var(--muted); flex:none}
  .big.on{border-color:var(--amber); background:#FFF7EC}
  .big.hero{
    background:linear-gradient(180deg,var(--amber-2),var(--amber)); border-color:var(--amber);
    color:#fff; font-size:22px; justify-content:center; min-height:68px;
    box-shadow:0 6px 0 #C4740A;
  }
  .big.hero .sub{color:#FFF1DC}
  .big.hero:active{box-shadow:0 2px 0 #C4740A; transform:translateY(4px)}
  .big.calm{background:var(--cream)}
  .big.warnbtn{border-color:#E7C48A; background:var(--warn-bg)}
  .big[disabled]{opacity:.42; box-shadow:none; cursor:default}
  .actrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-bottom:10px}
  .act{
    min-height:58px; border-radius:16px; border:2px solid var(--line); background:var(--cream);
    font:inherit; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; line-height:1.15;
  }
  .act:active{background:#EFE8DA}
  .act .ic{font-size:19px}
  .quitlink{
    display:block; width:100%; margin-top:14px; padding:12px; border:none; background:none;
    font:inherit; font-size:15px; font-weight:700; color:var(--muted); text-decoration:underline; cursor:pointer;
  }
  .big .n{
    font-size:15px; font-weight:800; padding:4px 12px; border-radius:999px;
    background:var(--cream); color:var(--ink); flex:none;
  }
  .big.warnbtn .n{background:#F4DDB4}

  /* ── the item being counted / mapped ── */
  .itemcard{display:flex; gap:12px; align-items:center; margin-bottom:12px}
  .shot{
    width:92px; height:92px; flex:none; border-radius:20px; background:var(--cream);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .itemcard .body{flex:1; min-width:0}
  .shot img{max-width:100%; max-height:100%; object-fit:contain}
  .shot .noimg{font-size:44px; opacity:.35}
  .iname{font-size:19px; font-weight:800; line-height:1.3; margin:0 0 6px; overflow-wrap:anywhere}
  .imeta{display:flex; flex-wrap:wrap; gap:8px}
  .tag{
    font-size:15px; font-weight:700; padding:6px 12px; border-radius:999px;
    background:var(--cream); border:1px solid var(--line);
  }
  .tag.shelf{background:var(--warn-bg); border-color:#E7C48A; color:var(--warn)}
  .tag.qty{background:var(--good-bg); border-color:#BFE3CD; color:var(--good)}
  .ltr{direction:ltr; unicode-bidi:isolate; display:inline-block}

  /* ── progress ── */
  .prog{margin:0 0 12px}
  .progbar{height:12px; border-radius:999px; background:var(--line); overflow:hidden}
  .progbar i{display:block; height:100%; background:var(--amber); border-radius:999px; transition:width .2s}
  .progtx{display:flex; justify-content:space-between; font-size:15px; font-weight:700; color:var(--muted); margin-top:6px}

  /* ── the number pad ── */
  .num{
    height:72px; border-radius:20px; border:2px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
    font-size:38px; font-weight:800; direction:ltr; font-variant-numeric:tabular-nums;
  }
  .num.empty{color:#C7BDA8}
  /* ⚠ direction:ltr is DELIBERATE — see the note in the head comment. */
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; direction:ltr}
  .key{
    height:58px; border-radius:16px; border:2px solid var(--line); background:var(--card);
    font:inherit; font-size:28px; font-weight:800; cursor:pointer; color:var(--ink);
  }
  .key:active{background:var(--cream)}
  .key.plus{background:var(--good-bg); border-color:#BFE3CD; color:var(--good); font-size:24px}
  .key.del{background:var(--bad-bg); border-color:#F0C8C4; color:var(--bad); font-size:18px}

  /* ── notes, states ── */
  .note{
    border-radius:16px; padding:14px 16px; margin:0 0 14px; font-size:16px; font-weight:600;
    background:var(--cream); border:1px solid var(--line);
    overflow-wrap:anywhere;          /* a long unbroken token (a URL, a code) wraps — never widens the page */
  }
  .note ul.orph{margin:8px 0 0; padding-inline-start:20px; font-weight:700}
  .note ul.orph li{margin:4px 0}
  /* the typed value is a pill of its own: next to a wrapped model number («… MXL 1075») a bare «: 44» read as one figure */
  .note ul.orph .v{display:inline-block; margin-inline-start:6px; padding:0 9px; border-radius:9px; background:#fff; border:1px solid #E7C48A; color:var(--ink)}
  .note.warn{background:var(--warn-bg); border-color:#E7C48A; color:var(--warn)}
  .note.bad{background:var(--bad-bg); border-color:#F0C8C4; color:var(--bad)}
  .note.good{background:var(--good-bg); border-color:#BFE3CD; color:var(--good)}
  .state{padding:40px 10px; text-align:center; color:var(--muted); font-size:18px}

  /* ── the finish screen ── */
  .doneicon{font-size:76px; text-align:center; margin:18px 0 6px}
  .donebig{font-size:27px; font-weight:800; text-align:center; margin-bottom:8px}
  .donesub{text-align:center; color:var(--muted); font-size:17px; margin-bottom:22px}

  /* ── manager lists (denser is allowed here — this screen is for Amr/Qusay) ── */
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px;
  }
  .rowtop{display:flex; gap:10px; align-items:baseline; justify-content:space-between}
  .rowname{font-weight:700; font-size:17px}
  .rowsub{color:var(--muted); font-size:14px; margin-top:2px}
  .figure{font-weight:800; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate}
  .figure.bad{color:var(--bad)} .figure.good{color:var(--good)}
  .reschips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .res{
    min-height:48px; padding:10px 16px; border-radius:14px; border:2px solid var(--line);
    background:var(--cream); font:inherit; font-size:16px; font-weight:700; cursor:pointer;
  }
  .res.on{border-color:var(--amber); background:#FFF7EC}
  .savebtn{
    width:100%; min-height:56px; margin-top:12px; border-radius:16px; border:none;
    background:var(--amber); color:#fff; font:inherit; font-size:18px; font-weight:800; cursor:pointer;
  }
  .savebtn[disabled]{opacity:.4}

  /* ── login ── */
  .login input{
    width:100%; min-height:var(--tap); margin-bottom:12px; padding:0 16px; font:inherit; font-size:18px;
    border-radius:16px; border:2px solid var(--line); background:var(--card); direction:ltr;
  }
  /* ── STACK WAREHOUSES (phase33, 28 Sep 2026) ──────────────────────────────
     A floor-stacked warehouse numbers its stacks 1..N; the stack NUMBER is how
     a person finds the goods, so it is the biggest thing on every screen. */
  .big.hero .tx{text-align:center}
  .big.hero.done{background:var(--good-bg); border-color:#BFE3CD; color:var(--good); box-shadow:none}
  .big.hero.done .sub{color:var(--good)}
  .big.hero.done[disabled]{opacity:1}
  .kome{font-size:34px; font-weight:800; line-height:1; white-space:nowrap}
  .kome .ltr{font-variant-numeric:tabular-nums}
  .imeta.km{align-items:center; gap:10px}
  .kpart{font-size:14px; font-weight:700; color:var(--muted)}
  .goask{font-size:24px; font-weight:800; line-height:1.25; margin:2px 0 10px}
  .goask .gn{font-size:46px; font-variant-numeric:tabular-nums}
  .zone{color:var(--muted); font-size:16px; font-weight:700; margin:0 0 12px}
  .mmap{position:relative; height:270px; border-radius:18px; overflow:hidden; background:#fff;
        border:2px solid var(--line); margin:0 0 10px}
  .mmap img{position:absolute; max-width:none; user-select:none; pointer-events:none}
  .mmap svg{position:absolute; left:0; top:0; pointer-events:none}
  .mmap .mmwait{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        padding:18px; text-align:center; color:var(--muted); font-weight:700; font-size:16px}
  .mmap.fail{height:auto; border-style:dashed; background:var(--warn-bg); border-color:#E7C48A}
  .mmap.fail .mmwait{position:static; color:var(--warn)}
  .num.exm{font-size:30px}
  .num .eqv{font-size:24px; color:var(--good); margin-left:14px}
  .pad.expr{grid-template-columns:repeat(6,1fr)}
  .pad.expr .key{grid-column:span 2}
  .pad.expr .key.op{grid-column:span 3; background:var(--cream); font-size:32px}
  .irow{
    display:flex; align-items:center; gap:12px; width:100%; min-height:76px; padding:10px 14px;
    margin-bottom:10px; border-radius:18px; border:2px solid var(--line); background:var(--card);
    font:inherit; color:var(--ink); text-align:start; cursor:pointer;
  }
  .irow .shot{width:56px; height:56px; border-radius:14px}
  .irow .shot .noimg{font-size:26px}
  .irow .tx{flex:1; min-width:0; font-size:16px; font-weight:700; line-height:1.3; overflow-wrap:anywhere}
  .irow .sub{display:block; font-size:14px; color:var(--muted); font-weight:700}
  .irow .rm{flex:none; min-height:58px; padding:0 16px; border-radius:14px; border:2px solid #F0C8C4;
        background:var(--bad-bg); color:var(--bad); font:inherit; font-size:16px; font-weight:800; cursor:pointer}
  .sumstrip{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 14px}
  .sumcell{border-radius:16px; padding:10px 14px; background:var(--card); border:1px solid var(--line)}
  .sumcell .fig{display:block; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}
  .sumcell .lb{font-size:14px; font-weight:700; color:var(--muted)}
  .sumcell.loss .fig{color:var(--bad)} .sumcell.gain .fig{color:var(--good)}
  .rowact{width:100%; min-height:58px; margin-top:10px; border-radius:14px; border:2px solid var(--line);
        background:var(--cream); font:inherit; font-size:16px; font-weight:800; color:var(--ink); cursor:pointer}
  .rowact.go{background:var(--amber); border-color:var(--amber); color:#fff}
  .rowact[disabled]{opacity:.45}
  /* round 2: the walk's name is TWO lines at most — a 75-character catalogue name used
     to push «ما في ولا وحدة / مو هون / رجوع» below the 844px fold */
  .iname.clamp{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  /* the approvers' reason chips and save on the stack ledger: ≥58px like every new control */
  .res.tall, .savebtn.tall{min-height:58px}
  .big .sub.bad{color:var(--bad)}
  @media (max-width:380px){ .ask{font-size:21px} .big{font-size:18px} .key{height:60px} }
</style>
</head>

/* ───────────────────────── config ───────────────────────── */
const SUPABASE_URL = "https://ohprikkwnymjtcxzoylq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocHJpa2t3bnltanRjeHpveWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNDQ5MjQsImV4cCI6MjA5ODkyMDkyNH0.0nI52H8ZV6fuj948WGk-ZLDVSgIu9y59_9R2a_jZST0";
const AUTH_KEY = "lw_dash_auth";
/* «نسخة العرض» (phase32, Sep 17 2026): a session whose user_metadata.demo is
   true is a client-meeting login. Every /rest/v1/<table> it makes is
   rewritten to /rest/v1/demo_<table> — the synthetic company — at the fetch
   layer, checked at CALL time (the login lands after this script runs). RLS
   on the server refuses that account every real table anyway; this is what
   makes its screens show data at all. Same rule as the portal's src/demo.js. */
(function(){
  const T = new Set(["withdrawals","payments","fund_entries","fund_counts","quotes","transfers",
    "abill_prices","alameen_docs","alameen_bills","alameen_bills_2025","gl_docs","gl_docs_2025",
    "gl_accounts","gl_accounts_2025","irth_docs","irth_accounts","funds","fx_rates","price_memory",
    "price_memory_2025","site_events","elias_adjust","elias_settings","customer_notes","service_status",
    "statements","stock_counts","stock_count_sessions","item_locations","customers","dashboard_items","branches","supplier_costs"]);
  const R = `${SUPABASE_URL}/rest/v1/`;
  const isDemo = () => { try { const a = JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); return !!(a && a.user && a.user.user_metadata && a.user.user_metadata.demo === true); } catch { return false; } };
  const f = window.fetch.bind(window);
  window.fetch = (u, i) => {
    if (typeof u === "string" && u.startsWith(R) && isDemo()) {
      const m = /^([a-z0-9_]+)(.*)$/s.exec(u.slice(R.length));
      if (m && T.has(m[1])) u = R + "demo_" + m[1] + m[2];
    }
    return f(u, i);
  };
  const band = () => {
    if (!isDemo() || document.getElementById("demoband")) return;
    const d = document.createElement("div"); d.id = "demoband";
    d.style.cssText = "position:sticky;top:0;z-index:999;background:repeating-linear-gradient(135deg,#E8870B 0 12px,#F2A23A 12px 24px);color:#1C1813;font-weight:700;font-size:13px;text-align:center;padding:6px 12px;";
    d.textContent = "🧪 نسخة عرض — كل الأسامي والأرقام وهمية · Demo — all names and figures are dummy";
    document.body.prepend(d);
  };
  if (document.body) band(); else document.addEventListener("DOMContentLoaded", band);
  window.__lwDemoBand = band;
})();

/* ───────────────────────── auth (shared with index.html) ───────────────────────── */
function savedAuth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch{ return null; } }
let refreshing = null;   // one in-flight refresh shared by concurrent callers (tokens rotate)
async function getToken(){
  const a = savedAuth();
  if(!a) return null;
  if(a.expires_at*1000 > Date.now()+60000) return a.access_token;
  if(!refreshing) refreshing = refreshAuth(a).finally(()=>{ refreshing = null; });
  return refreshing;
}
async function refreshAuth(a){
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST', headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token:a.refresh_token})
  });
  if(!r.ok){ localStorage.removeItem(AUTH_KEY); return null; }
  a = await r.json(); localStorage.setItem(AUTH_KEY, JSON.stringify(a));
  return a.access_token;
}
function me(){
  const a = savedAuth();
  const u = a && a.user ? a.user : null;
  const md = u && u.user_metadata ? u.user_metadata : {};
  return { id: u ? u.id : null, name: md.name || (u ? String(u.email||'').split('@')[0] : ''), email: u ? u.email : '' };
}

/* ───────────────────────── REST ─────────────────────────
   ⚠ Every read is PAGED. PostgREST caps a response at 1000 rows on this
   instance, so a bare select silently truncates once a table outgrows it — and
   a short count list looks exactly like «those items are not here». */
async function rest(path, opts){
  const tk = await getToken();
  if(!tk) throw new Error('no-session');
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${tk}`, 'Content-Type':'application/json',
    }, (opts && opts.headers) || {}),
  }));
  if(!r.ok){ const b = await r.text(); const e = new Error(b || ('HTTP '+r.status)); e.status = r.status; throw e; }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
/* same pager as index.html (restPages): offset/limit — never a Range header,
   which makes Chrome refuse compression — a counted first page, the rest in
   parallel. The error keeps the server's own text so the pre-paste screen can
   still name the missing table. */
async function restAll(path, expectRows){
  const tk = await getToken();
  if(!tk) throw new Error('no-session');
  const PAGE = 1000;
  const sep = path.includes('?') ? '&' : '?';
  const get = async (from, extra)=>{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}${sep}offset=${from}&limit=${PAGE}`, { headers:{
      apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${tk}`, ...(extra||{}) } });
    if(!r.ok){ const b = await r.text(); const e = new Error(b || ('HTTP '+r.status)); e.status = r.status; throw e; }
    return { rows: await r.json(), total: Number((r.headers.get('content-range')||'').split('/')[1]) };
  };
  const guess = Math.max(1, Math.ceil((expectRows || 0) / PAGE));
  const burst = await Promise.all(
    Array.from({length: guess}, (_,i)=> get(PAGE*i, i===0 ? { Prefer:'count=exact' } : undefined)));
  const out = [];
  let from = 0, lastLen = PAGE;
  for(const p of burst){ out.push(...p.rows); from += PAGE; lastLen = p.rows.length; }
  if(lastLen < PAGE) return out;
  const total = burst[0].total;
  if(Number.isFinite(total) && total > from){
    const pages = await Promise.all(
      Array.from({length: Math.ceil((total-from)/PAGE)}, (_,i)=> get(from + PAGE*i)));
    for(const p of pages){ out.push(...p.rows); from += PAGE; lastLen = p.rows.length; }
    if(lastLen < PAGE) return out;
  }
  for(;;from+=PAGE){ const p = await get(from); out.push(...p.rows); if(p.rows.length < PAGE) break; }
  return out;
}

async function loadAll(){
  const cols = 'code,name,latin_name,unit,qty,brand,image_url,cost,stock_by_store,synced_at';
  const [items, locRows, branches, roles] = await Promise.all([
    restAll(`dashboard_items?select=${cols}`, 3000),
    restAll('item_locations?select=code,store,loc'),
    restAll('branches?select=id,name,kind,active,stores&order=id'),
    restAll('staff_roles?select=uid,role,branch_id'),
  ]);
  S.items = items;
  S.branches = branches;
  const locs = new Map();
  for(const r of locRows){ const l = locs.get(r.code) || []; l.push(r); locs.set(r.code, l); }
  S.locs = locs;
  const uid = me().id;
  const mine = roles.find((r) => r.uid === uid) || null;
  // ⚠ NO ROW = MANAGER, the phase24 default. Every account without a staff_roles
  // row is a manager, which is how the whole team works today.
  S.isManager = !mine || mine.role === 'manager';
  S.branch = mine && mine.role === 'branch' ? (branches.find((b) => b.id === mine.branch_id) || null) : null;
  const allStores = AU.storesSeen(items, []).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));
  S.stores = AU.visibleStores({ branch:S.branch, branches, allStores });
  S.abc = AU.abcClassify(items);
  try{ S.sessions = await restAll('stock_count_sessions?select=*&order=started_at.desc'); }
  catch(e){ if(AU.TABLE_MISSING.test(String(e.message))) S.sessions = []; else throw e; }
}

/* ── W1 (round 3): what was typed in a RACK count on a STACK warehouse is kept, never saved ──
   The values are not resumable and not saveable there (phase33 refuses a count with no stacks
   in a mapped warehouse), but they are someone's work — they stay on screen, on this device,
   until the person says they have seen them. */
const ORPH = () => `lw_wh_rack_orphan_v1_${me().id || 'anon'}`;
function readOrphans(){ try{ const a = JSON.parse(localStorage.getItem(ORPH()) || '[]'); return Array.isArray(a) ? a : []; }catch{ return []; } }
function orphanRack(store, vals){
  const v = {};
  for(const [c, x] of Object.entries(vals || {})) if(x != null && x !== '') v[c] = String(x);
  if(!Object.keys(v).length) return;
  try{
    const a = readOrphans(), i = a.findIndex((o)=> o.store === store);
    if(i >= 0) a[i] = { store, vals:Object.assign({}, a[i].vals, v), at:Date.now() };
    else a.unshift({ store, vals:v, at:Date.now() });
    localStorage.setItem(ORPH(), JSON.stringify(a.slice(0, 3)));
  }catch{}
}
function dropOrphan(store){
  try{ const a = readOrphans().filter((o)=> o.store !== store);
       if(a.length) localStorage.setItem(ORPH(), JSON.stringify(a)); else localStorage.removeItem(ORPH()); }catch{}
}

let PAD = '';
function padHtml(val, hint){
  // ⚠ 'expr' (the stack count: × and + for cartons) and 'int' (a stack number) are
  // separate layouts; the plain rack counter below is untouched.
  if(hint === 'expr') return `
    <div class="num${val ? '' : ' empty'}${/[×+]/.test(val || '') ? ' exm' : ''}" id="numbox">${exprInner(val)}</div>
    <div class="pad expr">
      ${[1,2,3,4,5,6,7,8,9].map((d)=>`<button class="key" data-d="${d}">${d}</button>`).join('')}
      <button class="key del" data-d="del">${t('clear')}</button>
      <button class="key" data-d="0">0</button>
      <button class="key" data-d=".">.</button>
      <button class="key op" data-d="×" aria-label="×">×</button>
      <button class="key op" data-d="+" aria-label="+">+</button>
    </div>`;
  if(hint === 'int') return `
    <div class="num${val ? '' : ' empty'}" id="numbox">${val ? esc(val) : '—'}</div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map((d)=>`<button class="key" data-d="${d}">${d}</button>`).join('')}
      <button class="key del" data-d="del">${t('clear')}</button>
      <button class="key" data-d="0" style="grid-column:span 2">0</button>
    </div>`;
  return `
    <div class="num${val ? '' : ' empty'}" id="numbox">${val ? esc(val) : '—'}</div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map((d)=>`<button class="key" data-d="${d}">${d}</button>`).join('')}
      <button class="key del" data-d="del">${t('clear')}</button>
      <button class="key" data-d="0">0</button>
      <button class="key" data-d=".">.</button>
      <button class="key plus" data-d="+1" style="grid-column:1 / -1">+1</button>
    </div>`;
}
function wirePad(onChange, mode){
  document.querySelectorAll('[data-d]').forEach((k)=>{
    k.onclick = ()=>{
      const d = k.getAttribute('data-d');
      if(mode === 'expr' || mode === 'int') PAD = padPress(PAD, d, mode);
      else if(d === 'del') PAD = '';                 // clear the whole entry — see the head comment
      else if(d === '+1'){ const n = AU.numOf(PAD); PAD = String((n == null ? 0 : n) + 1); }
      else if(d === '.'){ if(!PAD.includes('.')) PAD = (PAD || '0') + '.'; }
      else PAD = (PAD === '0' ? '' : PAD) + d;
      onChange();
    };
  });
}

/* ── save: expected is computed HERE, server-fresh (the Aug-9 cashbox lesson) ── */
async function doSave(){
  const entries = S.list.map((r)=>({ code:r.code, counted: AU.numOf(S.vals[r.code]), loc:r.loc }))
    .filter((e)=> e.counted != null);
  if(!entries.length){ S.stack=[]; go('home', false); return; }
  S.entries = entries; go('saving', false);
  try{
    const codes = entries.map((e)=>e.code);
    const fresh = [];
    for(let i=0;i<codes.length;i+=100){
      const chunk = codes.slice(i,i+100).map(encodeURIComponent).join(',');
      fresh.push(...await rest(`dashboard_items?select=code,qty,stock_by_store,synced_at&code=in.(${chunk})`));
    }
    const byCode = new Map(fresh.map((r)=>[r.code,r]));
    const syncedAt = fresh.reduce((m,r)=> (r.synced_at && r.synced_at > m ? r.synced_at : m), '') || null;
    const live = await rest(`withdrawals?select=id,kind,status,store,customer,items,processed_at,created_at&status=in.(pending,flagged)&limit=1000`);
    let doneRows = [];
    if(syncedAt) doneRows = await rest(`withdrawals?select=id,kind,status,store,customer,items,processed_at,created_at&status=eq.done&processed_at=gt.${encodeURIComponent(syncedAt)}&limit=1000`);
    const slips = [...live, ...doneRows];
    const pending = AU.pendingMovements(slips, S.store, syncedAt);
    const unattributed = AU.unattributedSlips(slips, syncedAt);

    const u = me();
    const sess = (await rest('stock_count_sessions', { method:'POST', headers:{Prefer:'return=representation'},
      body: JSON.stringify([{ store:S.store, scope:AU.scopeKey(S.scope), started_by:u.id,
        started_by_name:u.name, synced_at:syncedAt,
        ...(S.branch ? { branch_id:S.branch.id } : {}) }]) }))[0];

    const rows = AU.buildCountRows({ sessionId:sess.id, store:S.store, entries, byCode, pending,
      uid:u.id, authorName:u.name });
    const saved = [];
    for(let i=0;i<rows.length;i+=200){
      saved.push(...await rest('stock_counts', { method:'POST', headers:{Prefer:'return=representation'},
        body: JSON.stringify(rows.slice(i,i+200)) }));
    }
    const off = saved.filter((r)=> AU.isOff(r.variance));
    S.result = { session:sess, rows:saved, off, unattributed };
    clearDraft();
    if(off.length){ S.reIdx = 0; S.reVals = {}; PAD=''; go('recount', false); }
    else { await closeSession(sess.id, saved.length, 0); go('done', false); }
    loadAll().catch(()=>{});
  }catch(e){
    const m = String(e.message || e);
    if(STACK_REFUSED.test(errText(e))) return rackStop(S.store, S.vals);
    go('saveerr', false, AU.TABLE_MISSING.test(m)
      ? `${t('sql_missing')} ${AU.COUNT_SQL_FILE}` : `${t('save_err')} — ${errText(e).slice(0,160)}`);
  }
}
async function closeSession(id, items, off){
  await rest(`stock_count_sessions?id=eq.${id}`, { method:'PATCH',
    body: JSON.stringify({ status:'closed', closed_at:new Date().toISOString(), items, off }) });
}

async function doRecount(){
  go('saving', false);
  try{
    const updated = [];
    for(const r of S.result.off){
      const v = AU.numOf(S.reVals[r.code]);
      if(v == null) continue;
      const variance = AU.varianceOf(r.expected, null, v);
      const u = await rest(`stock_counts?id=eq.${r.id}`, { method:'PATCH', headers:{Prefer:'return=representation'},
        body: JSON.stringify({ recount: AU.r3(v), variance }) });
      updated.push(...u);
    }
    const byId = new Map(updated.map((u)=>[u.id,u]));
    const finalRows = S.result.rows.map((r)=> byId.get(r.id) || r);
    const off = finalRows.filter((r)=> AU.isOff(r.variance)).length;
    await closeSession(S.result.session.id, finalRows.length, off);
    S.result = Object.assign({}, S.result, { rows:finalRows, offFinal:off });
    go('done', false);
    loadAll().catch(()=>{});
  }catch(e){ go('saveerr', false, `${t('save_err')} — ${errText(e).slice(0,160)}`); }
}

/* ═════════════════════ STACK WAREHOUSES (phase33, 28 Sep 2026) ═════════════════════

const RECOUNT_HELD = true;

// plan px and put 9 of 117 discs on walls (the push clears only the stack's own wall — the
// round-1 claim «the gate holds at any scale» was false). r = 20 × s / 1.10 keeps the

const MINI_SCALE = 0.77;

// ⚠ BOUNDED (round 3, W2): a gateway in front of Supabase (Cloudflare 520/522/524) answers
// with an HTML PAGE, not PostgREST JSON. Printed whole it was a 3,700-px wall of markup on
// home that also widened the page past the screen. HTML becomes «HTTP <status>»; any other
// text is cut at 180 characters. Every message a person reads goes through here — the
// full text is still on e.message for the tests that key on it (23505, TABLE_MISSING…).
function errText(e){
  const m = String((e && e.message) || e || '');
  let s = m;

  if(/^\s*</.test(s)) return `HTTP ${(e && e.status) || ''}`.trim();
  return s.length > 180 ? s.slice(0, 179) + '…' : s;
}

  return `${t('save_err')} — ${errText(e).slice(0,180)}`;

/* ── load: in the BACKGROUND, behind a home screen that is already up (D10) ── */
const STK_TIMEOUT = 8000;                      // a hung request must not hold the rack flows
const STK_CACHE = 'lw_wh_stack_stores_v1';     // this device's last GOOD map list
let STK_GEN = 0;                               // a retry makes every older load stale

function writeStkCache(stores){ try{ localStorage.setItem(STK_CACHE, JSON.stringify(stores)); }catch{} }
// the stores this device KNOWS are stacked. Once the maps are loaded they alone decide;

// into item_locations) stand in for them
function knownStackStores(){
  const out = new Set();

  if(S.stkState === 'ok' || S.stkState === 'none') return out;

function startStacks(){

  S.stkState = 'loading';

async function loadStacks(gen){
  const uid = me().id;
  // the map list and MY approver row first, each on its own (the ledger door needs the
  // second even where there is no map: D3 makes every difference an approver's call)
  const [mapsR, apprR] = await Promise.allSettled([
    restAll('warehouse_maps?select=*&active=eq.true'),
    uid ? restAll(`stock_approvers?select=uid&uid=eq.${uid}`) : Promise.resolve([]),
  ]);
  if(gen !== STK_GEN) return 'stale';
  if(apprR.status === 'fulfilled'){ S.p33 = true; S.isApprover = apprR.value.length > 0; S.apprKnown = true; }
  if(mapsR.status === 'rejected'){
    // ⚠ only a MISSING table (pre-paste) falls back to today's page — any other failure
    // is loud (a timeout on warehouse_maps is not «this store has no stacks»)
    if(p33Missing(mapsR.reason)){ S.stk = null; S.p33 = false; S.isApprover = false; writeStkCache([]); return 'none'; }
    throw mapsR.reason;
  }
  S.p33 = true;
  if(apprR.status === 'rejected') throw apprR.reason;
  const maps = (mapsR.value || []).filter((m)=> S.stores.includes(m.store) && !AU.isHomeStore(m.store));
  writeStkCache(maps.map((m)=> m.store));
  if(!maps.length){ S.stk = null; return 'none'; }

    restAll(`warehouse_stacks?select=*&store=${IN}&order=stack_no`),
    restAll(`stack_items?select=store,stack_no,code&store=${IN}`),
    restAll(`warehouse_baselines?select=store,at,kind,by_name,session_id&store=${IN}&order=at.desc`),
    restAll(`cycle_days?select=*&store=${IN}&day=eq.${today}`),
    restAll(`stack_flags?select=*&store=${IN}&resolved_at=is.null&order=created_at.desc`),
    restAll(`stock_counts?select=id,code,store,counted_at,variance,recount,held,resolution_kind&store=${IN}&counted_at=gte.${enc(floor)}&order=counted_at.desc`),
    S.isApprover ? quiet(restAll(`stock_ledger?select=store,state&store=${IN}&state=in.(to_approve,held)`)) : Promise.resolve(null),
    // W6 (round 3): every SKU that left a stack in the last 30 days — the server writes the
    // log itself (a closed stack_flags row, kind 'removed'), so EVERY device can keep that
    // item's stock blind to a counter, not only the tablet that tapped «شيل»
    restAll(`stack_flags?select=store,stack_no,code,created_at&store=${IN}&kind=eq.removed&created_at=gte.${enc(cut30)}&order=created_at.desc`),
  ]);

  const base = new Map();
  for(const b of bases) if(!base.has(b.store)) base.set(b.store, b);
  const K = { maps:new Map(maps.map((m)=>[m.store,m])), rows:new Map(), idx:new Map(), sitems, base,
              cycle:new Map(), cycleErr:new Map(), cycleBusy:new Map(), cycleGen:new Map(), flags, counts,
              removed: removed || [], plan:new Map(), ledN:new Map() };
  for(const st of stores) K.rows.set(st, new Map());
  for(const r of stacks) if(K.rows.has(r.store)) K.rows.get(r.store).set(Number(r.stack_no), r);
  for(const st of stores) K.idx.set(st, AU.stackIndex(sitems, st));

}

  const [live, done] = await Promise.all([
    rest(`withdrawals?select=${cols}&status=in.(pending,flagged)&limit=1000`),
    mirrorAt ? rest(`withdrawals?select=${cols}&status=eq.done&processed_at=gt.${enc(mirrorAt)}&limit=1000`) : Promise.resolve([]),
  ]);
  const slips = [...(live || []), ...(done || [])];
  const picks = new Map();
  const ids = [...new Set(slips.map((w)=> w.id).filter(Boolean))];
  for(let i=0;i<ids.length;i+=100){
    const rows = await rest(`pick_lists?select=slip_id,version,plan&slip_id=in.(${ids.slice(i,i+100).map(enc).join(',')})&order=version.desc`) || [];
    for(const r of rows) if(!picks.has(r.slip_id)) picks.set(r.slip_id, r.plan || []);
  }
  const cq = codes && codes.length === 1 ? `&code=eq.${enc(codes[0])}` : '';
  const [positions, posts] = await Promise.all([
    restAll(`stock_positions?select=store,code,count_id,mirror_at,counted_at,gap,to_post,resolution_kind&store=eq.${enc(store)}${cq}`),
    restAll(`stock_adjust_posts?select=store,code,amount,posted_at&store=eq.${enc(store)}${cq}`),
  ]);
  let transfers = [];
  if(withTransfers){
    // ⚠ a failed read here could let a sale in flight read as a loss — so it FAILS
    // the save (loud, with a retry) unless the table simply does not exist
    try{ transfers = await rest('transfers?select=no,status,posted_at,items,items_sent&status=eq.dispatched&limit=500') || []; }
    catch(e){ if(!AU.TABLE_MISSING.test(String(e.message))) throw e; }
  }
  return { slips, picks, positions, posts, transfers };
}
async function computeCycle(store){
  const K = S.stk, ix = K.idx.get(store), map = K.maps.get(store);
  const codes = [...ix.byCode.keys()];
  const byItem = new Map(S.items.map((i)=>[i.code,i]));
  const mirrorAt = mirrorOf(S.items);
  const ctx = await stackCtx(store, codes, mirrorAt, false);
  const pending = AU.pendingMovementsPicked(ctx.slips, store, mirrorAt, ctx.picks);
  const rem = AU.remainingGaps(ctx.positions, ctx.posts, mirrorAt);
  // a stack a picker is still working (an open printed sheet whose slip is not typed yet)
  const busy = new Set();
  for(const w of ctx.slips){
    if(!w || w.status === 'voided' || w.kind === 'quote' || typedSlip(w)) continue;
    for(const p of ctx.picks.get(w.id) || []){
      if(p.store !== store) continue;
      for(const n of [...(p.stacks || []), ...AU.stacksOfCode(ix.byCode, p.code)]) busy.add(Number(n));
    }
  }
  const flagged = (k) => new Set(K.flags.filter((f)=> f.store === store && f.kind === k).map((f)=> Number(f.stack_no)));
  const b = K.base.get(store);
  return AU.cycleSelect({ byStack:ix.byStack, lastByCode:AU.lastCountedByCode(K.counts, store),
    baselineAt: b ? b.at : null, abc: AU.storeAbc(S.items, store, codes),
    workingOf: (c)=> AU.workingQty(byItem.get(c) || { code:c, stock_by_store:{} }, store, pending, rem),
    today: AU.damascusDay(), perDay: Number(map.cycle_per_day) || 8, due: map.due_days,
    busyStacks: busy, notHere: flagged('not_here'), shortStacks: flagged('short'),
    recountCodes: unverifiedCodes(store) });
}
// D4 (round 2): codes whose NEWEST count in this warehouse found a difference and was
// never recounted (a walk abandoned, a tablet that died) — they come back FIRST, which
// is what «ما انعادت — بترجع أول شي بعدّة الصبح» promises. A row older than the newest
// baseline no longer matters.
function unverifiedCodes(store){
  const K = S.stk, ix = K.idx.get(store), b = K.base.get(store), bAt = b ? Date.parse(b.at) : -Infinity;
  const newest = new Map();
  for(const r of K.counts){
    if(r.store !== store) continue;
    const p = newest.get(r.code);
    if(!p || Date.parse(r.counted_at) > Date.parse(p.counted_at)) newest.set(r.code, r);
  }
  const out = new Set();
  for(const [c, r] of newest) if(ix.byCode.has(c) && AU.isOff(r.variance) && r.recount == null
    && Date.parse(r.counted_at) >= bAt) out.add(c);
  return out;
}
// one computation per warehouse at a time, in the background; its reason is kept.
// ⚠ W4 (round 3): it RACES STK_TIMEOUT. A hung read inside it (the withdrawals, the pick
// lists, the positions, the cycle_days POST/GET) used to leave «عم نحضّر عدّة اليوم…» on
// screen for ever — no note, no retry. Now the door turns loud with its retry after 8 s;
// the retry starts a NEW generation, and a late answer from the old one still lands (a real
// row is the server's truth whichever attempt read it) and clears the note.
function cycleBg(store){
  const K = S.stk; if(!K) return Promise.resolve(null);
  if(K.cycleBusy.has(store)) return K.cycleBusy.get(store);
  const gen = (K.cycleGen.get(store) || 0) + 1; K.cycleGen.set(store, gen);
  const repaint = ()=>{ if(S.stk === K && REFRESH.has(S.screen)) render(); };
  let timer = null, late = false;
  const work = ensureCycle(store, gen).catch(()=> null);
  const slow = new Promise((res)=>{ timer = setTimeout(()=>{
    late = true;
    if(K.cycleGen.get(store) === gen && !K.cycle.has(store)) K.cycleErr.set(store, t('cyc_slow'));
    res(null);
  }, STK_TIMEOUT); });
  const p = Promise.race([work, slow]).finally(()=>{
    clearTimeout(timer);
    if(K.cycleBusy.get(store) === p) K.cycleBusy.delete(store);
    repaint();
  });
  K.cycleBusy.set(store, p);
  work.then(()=>{ if(late) repaint(); });
  return p;
}
async function ensureCycle(store, gen){
  const K = S.stk, today = AU.damascusDay(), u = me();
  // only the NEWEST attempt may write a failure (an old one that fails late must not paint
  // its error over a retry that is still running)
  const latest = () => gen == null || K.cycleGen.get(store) === gen;
  let sel;
  // ⚠ a throw here used to escape before cycleErr was set — after «أعد عدّة اليوم» the
  // home door then said «ما في كومات لعدّة اليوم» over a DELETED day (round-2 X5)
  try{ sel = await computeCycle(store); }
  catch(e){ if(latest()){ K.cycle.delete(store); K.cycleErr.set(store, errText(e) || t('err')); } throw e; }
  let err = '';
  try{
    await rest('cycle_days?on_conflict=store,day', { method:'POST',
      headers:{ Prefer:'resolution=ignore-duplicates,return=minimal' },
      body: JSON.stringify([{ store, day:today, stacks:sel.stacks, reasons:sel.reasons,
                              created_by:u.id, created_by_name:u.name }]) });
  }catch(e){ err = errText(e); }
  // FIRST WRITER WINS: whatever the server holds now is the day's list, for everyone
  let row = null;
  try{ row = ((await rest(`cycle_days?select=*&store=eq.${enc(store)}&day=eq.${today}`)) || [])[0] || null; }
  catch(e){ err = err || errText(e); }
  if(!row){
    if(!latest()) return null;
    row = { store, day:today, stacks:sel.stacks, reasons:sel.reasons, local:true }; K.cycleErr.set(store, err || '—');
  }
  else K.cycleErr.delete(store);
  K.cycle.set(store, row);
  return row;
}

// codes with a FINAL count today (a first pass that matched, or a completed recount),
// or reported «not on this stack» today — the counter's job on them is done
function doneTodayCodes(store){
  const K = S.stk, today = AU.damascusDay(), done = new Set();
  for(const r of K.counts) if(r.store === store && dayOf(r.counted_at) === today
    && (!AU.isOff(r.variance) || r.recount != null || (!RECOUNT_HELD && r.held))) done.add(r.code);
  for(const f of K.flags) if(f.store === store && f.kind === 'not_here' && f.code && dayOf(f.created_at) === today) done.add(f.code);
  return done;
}
// ⚠ W5 (round 3): the door counts the SAME stacks the walk visits (walkStacks) — and an
// emptied stack is never «done». every() over an empty list is true, so taking a stack's
// item off («شيل») used to tick it off uncounted: «1 من 2» over a walk of one, and
// «خلصت ✓» with the item never counted. A stack of today's list emptied TODAY (the server's
// 'removed' log, or this device's own «شيل») is named instead (goneToday).
function cycleProgress(store){
  const K = S.stk, row = K.cycle.get(store);
  if(!row) return { n:0, m:0, gone:[] };
  const ix = K.idx.get(store), done = doneTodayCodes(store);
  const nos = walkStacks(store, { kind:'cycle' });
  return { n: nos.filter((s)=> { const cs = ix.byStack.get(s) || []; return cs.length > 0 && cs.every((c)=> done.has(c)); }).length,
           m: nos.length, gone: goneToday(store) };
}
function goneToday(store){
  const K = S.stk, row = K.cycle.get(store), ix = K.idx.get(store), today = AU.damascusDay();
  if(!row) return [];
  return [...new Set((row.stacks || []).map(Number))].filter((n)=> !(ix.byStack.get(n) || []).length
    && (K.removed || []).some((f)=> f.store === store && Number(f.stack_no) === n && dayOf(f.created_at) === today)).sort((a, b)=> a - b);
}
const goneHtml = (gone) => gone.length ? `<div class="note warn">${t(gone.length > 1 ? 'cyc_gone_n' : 'cyc_gone', { n: stackList(gone) })}</div>` : '';

/* ── the walk list: stacks in number order; an SKU on two stacks brings its group ── */
function groupClose(ix, nos){
  const set = new Set(nos.map(Number));
  for(const g of AU.stackGroups(ix.byStack)) if(g.some((n)=> set.has(n))) g.forEach((n)=> set.add(n));
  return [...set].sort((a,b)=> a - b);
}
function walkStacks(store, scope){
  const K = S.stk, ix = K.idx.get(store), rows = K.rows.get(store);
  let nos = [];
  if(scope.kind === 'cycle') nos = ((K.cycle.get(store) || {}).stacks || []).map(Number);
  else if(scope.kind === 'baseline') nos = [...ix.byStack.keys()];
  else if(scope.kind === 'stack') nos = [Number(scope.stack)];
  else if(scope.kind === 'zone') nos = [...rows.values()].filter((r)=> r.zone === scope.zone).map((r)=> Number(r.stack_no));
  return groupClose(ix, nos.filter((n)=> (ix.byStack.get(n) || []).length));
}
// ⚠ the list keeps the day's FULL set (so «2 / 4» means the same before and after a
// resume); what another device already finished today is SKIPPED, not removed
function walkList(store, scope){
  const K = S.stk;
  return AU.stackCountList(S.items, K.idx.get(store).byStack, walkStacks(store, scope), [...K.rows.get(store).values()]);
}
const doneFor = (store, scope) => scope.kind === 'cycle' ? doneTodayCodes(store) : new Set();

/* ── the walk state + its draft (v2, keyed `${stack}|${code}`) ── */
function saveWDraft(){
  const W = S.walk; if(!W) return;
  try{ localStorage.setItem(STK_DRAFT(), JSON.stringify({ store:W.store, scope:W.scope, sid:W.sid, sAt:W.sAt,
    vals:W.vals, saved:W.saved, skip:W.skip, flagged:W.flagged, re:W.re, reQ:W.reQ || [], pend:W.pend || {},
    at:Date.now() })); }catch{}
}
function clearWDraft(){ try{ localStorage.removeItem(STK_DRAFT()); }catch{} }
function readWDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(STK_DRAFT()) || 'null');
    if(d && d.store && d.sid && d.scope && isStackStore(d.store)){
      // a morning list belongs to its morning — yesterday's half walk is not today's
      if(d.scope.kind === 'cycle' && d.scope.day !== AU.damascusDay()){ clearWDraft(); return null; }
      return d;
    }
  }catch{}
  return null;
}
const wOpen = (e) => { const W = S.walk; return !W.skip.includes(e.code) && !W.saved[e.code] && !W.done.has(e.code); };
const wPending = (e) => wOpen(e) && !S.walk.vals[e.key];
function wSkipAhead(){ const W = S.walk; while(W.pos < W.list.length && !wPending(W.list[W.pos])) W.pos++; }
function wStacks(){ return [...new Set(S.walk.list.map((e)=> e.stack))]; }
function wCur(){
  const W = S.walk; if(!W) return null;
  if(W.re){
    const n = W.re.stacks[W.re.i];
    const meta = W.list.find((e)=> e.code === W.re.code) || itemOf(W.re.code);
    return { stack:n, e:Object.assign({}, meta, { stack:n, code:W.re.code, key:`${n}|${W.re.code}`, part:null }), phase:W.re.phase, re:true };
  }
  const e = W.list[W.pos];
  return e ? { stack:e.stack, e, phase:W.phase, re:false } : null;
}

// a walk in words, for the «leave it?» question (plain text — it goes into confirm())
function scopeLabel(store, sc){
  const w = sc.kind === 'cycle' ? t('cyc_door') : sc.kind === 'baseline' ? t('sscope_all')
    : sc.kind === 'stack' ? `${t('stk')} ${sc.stack}` : sc.kind === 'zone' ? sc.zone : '';
  return `${w} — ${stackLabel(store)}`;
}
async function startWalk(store, scope){
  // ⚠ ONE draft slot per login (round-2 X2). The SAME walk resumes; a different one asks
  // first, and an abandoned walk's session is CLOSED — never left open for ever, and
  // never overwritten with its answers and its pending recount in silence.
  const d = readWDraft();
  if(d){
    if(d.store === store && AU.scopeKey(d.scope) === AU.scopeKey(scope)){ resumeWalk(); return; }
    if(!confirm(t('walk_abandon', { what: scopeLabel(d.store, d.scope) }))){ if(S.screen === 'boot'){ S.stack = []; go('home', false); } return; }
    const sv = d.saved || {}, codes = Object.keys(sv);
    try{ await closeSession(d.sid, codes.length, codes.filter((c)=> sv[c] && sv[c].off).length); }
    catch(e){ console.warn('closing the abandoned walk:', errText(e)); }
    clearWDraft();
  }
  const list = walkList(store, scope), done = doneFor(store, scope);
  S.pendingStart = { store, scope };
  if(!list.some((e)=> !done.has(e.code))){ S.walkDone = { n:0, flagged:0, base:null }; go('walkdone', false); return; }
  go('saving', false);
  try{
    const u = me();
    const sess = ((await rest('stock_count_sessions', { method:'POST', headers:{ Prefer:'return=representation' },
      body: JSON.stringify([{ store, scope:AU.scopeKey(scope), started_by:u.id, started_by_name:u.name,
        synced_at:mirrorOf(S.items), ...(S.branch ? { branch_id:S.branch.id } : {}) }]) })) || [])[0];
    if(!sess) throw new Error('no session came back');
    S.walk = { store, scope, sid:sess.id, sAt:sess.started_at || new Date().toISOString(), list, pos:0, phase:'go',
               vals:{}, saved:{}, skip:[], flagged:0, re:null, reQ:[], pend:{}, pendingOp:null, done };
    S.pendingStart = null;
    wSkipAhead(); saveWDraft(); planFor(store); PAD = ''; S.stack = []; go('walk', false);
  }catch(e){ go('walkerr', false, stkErrMsg(e)); }
}
// ⚠ ROUND 2 (X1/X7/G1): a count typed but not saved is NEVER dropped. On «كمّل» the
// server says what this session already holds (a save whose answer was lost, or a
// tablet that died between the POST and the draft) — those rows are ADOPTED, and one
// with a difference and no recount is recounted; whatever was answered and is still
// not on the server is saved before the walk moves on. wFinish checks the same.
async function resumeWalk(){
  const d = readWDraft(); if(!d) return;
  S.walk = { store:d.store, scope:d.scope, sid:d.sid, sAt:d.sAt, list:walkList(d.store, d.scope), pos:0, phase:'go',
             vals:d.vals || {}, saved:d.saved || {}, skip:d.skip || [], flagged:d.flagged || 0,
             re:d.re ? Object.assign({}, d.re, { phase:'go', adopted:true }) : null,
             reQ:d.reQ || [], pend:d.pend || {}, pendingOp:null, done:new Set() };
  const W = S.walk;
  planFor(d.store); PAD = ''; S.stack = [];
  go('saving', false);
  let rows;
  try{ rows = (await rest(`stock_counts?select=id,code,variance,recount,held,counted_at&session_id=eq.${enc(d.sid)}`)) || []; }
  catch(e){ W.pendingOp = { kind:'resume' }; go('walkerr', false, stkErrMsg(e)); return; }
  wAdoptRows(rows);
  // what THIS walk saved is in W.saved; what another device finished today is skipped
  for(const c of doneFor(d.store, d.scope)) if(!W.saved[c]) W.done.add(c);
  saveWDraft();
  for(const u of wUnsaved()){
    if(!(await wSave(u.entry, u.at, true))) return;
    if(W.re) break;
  }
  wSkipAhead();
  if(!W.re && W.pos >= W.list.length){ wFinish(); return; }
  go('walk', false);
}
// the session's rows on the server → this walk's saved answers (newest row per code)
function wAdoptRows(rows){
  const W = S.walk, newest = new Map();
  for(const r of rows) { const p = newest.get(r.code); if(!p || Date.parse(r.counted_at) > Date.parse(p.counted_at)) newest.set(r.code, r); }
  for(const r of newest.values()){
    W.saved[r.code] = { id:r.id, off:AU.isOff(r.variance) };
    if(W.pend[r.code] === r.id) delete W.pend[r.code];
    const loc = S.stk.counts.find((x)=> x.id === r.id);
    if(loc) Object.assign(loc, { variance:r.variance, recount:r.recount, held:!!r.held });
    else S.stk.counts.unshift({ id:r.id, code:r.code, store:W.store, counted_at:r.counted_at, variance:r.variance, recount:r.recount, held:!!r.held });
  }
  // the draft's own pending recount — dropped if the server already holds it (the guard
  // refuses a second recount for ever)
  if(W.re){ const sr = newest.get(W.re.code); if(sr && (sr.id !== W.re.id || sr.recount != null || !AU.isOff(sr.variance))) W.re = null; }
  for(const r of newest.values()){
    if(!AU.isOff(r.variance) || r.recount != null || (!RECOUNT_HELD && r.held)) continue;
    if((W.re && W.re.code === r.code) || W.reQ.some((q)=> q.code === r.code)) continue;
    W.reQ.push({ code:r.code, id:r.id });
  }
  if(!W.re && W.reQ.length) W.re = mkRe(W.reQ.shift());
}
// a blind recount detached from the walk's position (opened on resume or at the end):
// every stack of the SKU, in number order, starting with «روح عالكومة»
function mkRe(q){
  const W = S.walk, nos = AU.stacksOfCode(S.stk.idx.get(W.store).byCode, q.code);
  return { code:q.code, id:q.id, stacks: nos.length ? nos : [W.list.find((e)=> e.code === q.code)?.stack].filter((n)=> n != null),
           i:0, phase:'go', vals:{}, adopted:true };
}
// codes this walk has a COMPLETE answer for (every stack of the SKU) but no saved row
function wUnsaved(){
  const W = S.walk, ix = S.stk.idx.get(W.store), out = [], seen = new Set();
  for(const e of W.list){
    if(seen.has(e.code)) continue; seen.add(e.code);
    if(W.saved[e.code] || W.skip.includes(e.code) || W.done.has(e.code)) continue;
    const entry = AU.stackEntryFor(e.code, W.vals, ix.byCode);
    if(!entry) continue;
    const nos = AU.stacksOfCode(ix.byCode, e.code);
    out.push({ entry, at: nos.length ? nos[nos.length - 1] : e.stack });
  }
  return out;
}
// a fresh uuid for a count row: a retry of the SAME row hits its primary key, never a
// second row (round-2 X7: a lost answer + «حاول مرة تانية» wrote the count twice, and
// the first copy stayed «unverified» for ever)
function newId(){
  try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch{}
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map((x)=> x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

async function wAnswer(val){
  const W = S.walk, c = wCur(); if(!c) return;
  PAD = '';
  if(W.re){
    W.re.vals[c.stack] = val;
    if(W.re.i + 1 < W.re.stacks.length){ W.re.i++; W.re.phase = 'go'; saveWDraft(); go('walk', false); return; }
    saveWDraft(); await wRecountSave(); return;
  }
  W.vals[c.e.key] = val; saveWDraft();
  const entry = AU.stackEntryFor(c.e.code, W.vals, S.stk.idx.get(W.store).byCode);
  // ⚠ SAVED THE MOMENT THE LAST STACK OF THE SKU IS ANSWERED — half a total compared
  // with Al-Ameen's whole-warehouse figure is a false shortage (stackEntryFor says null)
  if(entry){
    if(!(await wSave(entry, c.stack))) return;
    if(W.re){ go('walk', false); return; }
  }
  wNext(c.stack);
}
function wNext(from){
  const W = S.walk;
  W.pos++; wSkipAhead();
  if(W.pos >= W.list.length){ wFinish(); return; }
  W.phase = W.list[W.pos].stack === from ? 'count' : 'go';
  saveWDraft(); go('walk', false);
}
async function wSave(entry, atStack, detached){
  const W = S.walk, store = W.store, u = me();
  go('saving', false);
  // the row's id is made HERE and kept in the draft until the server has the row
  const retry = !!W.pend[entry.code];
  const id = W.pend[entry.code] || newId();
  W.pend[entry.code] = id; saveWDraft();
  const byId = async () => ((await rest(`stock_counts?select=*&id=eq.${enc(id)}`)) || [])[0] || null;
  try{
    // a retry first asks whether the server already committed it (the answer was lost)
    let saved = retry ? await byId() : null;
    if(!saved){
      // server-fresh at SAVE time, never at screen load (the Aug-9 cashbox lesson)
      const it = ((await rest(`dashboard_items?select=code,qty,stock_by_store,synced_at&code=eq.${enc(entry.code)}`)) || [])[0]
        || { code:entry.code, stock_by_store:{} };
      const mirrorAt = it.synced_at || null;
      const ctx = await stackCtx(store, [entry.code], mirrorAt, true);
      const pending = AU.pendingMovementsPicked(ctx.slips, store, mirrorAt, ctx.picks);
      const rem = AU.remainingGaps(ctx.positions, ctx.posts, mirrorAt);
      const held = AU.inflightFor(ctx.slips, ctx.transfers, store, entry.code, mirrorAt, ctx.picks, isHubStore(store));
      const row = AU.buildStackCountRow({ sessionId:W.sid, store, entry, item:it, pending, rem, mirrorAt,
        uid:u.id, authorName:u.name, held });
      try{
        saved = ((await rest('stock_counts', { method:'POST', headers:{ Prefer:'return=representation' },
          body: JSON.stringify([Object.assign({ id }, row)]) })) || [])[0];
      }catch(e){
        // the primary key says it is already there: that IS the save
        if(!/23505|duplicate key/i.test(String(e.message))) throw e;
        saved = await byId();
      }
    }
    if(!saved) throw new Error('no row came back');
    delete W.pend[entry.code];
    W.saved[entry.code] = { id:saved.id, off:AU.isOff(saved.variance) };
    const loc = S.stk.counts.find((x)=> x.id === saved.id);
    if(loc) Object.assign(loc, { variance:saved.variance, recount:saved.recount ?? null, held:!!saved.held });
    else S.stk.counts.unshift({ id:saved.id, code:entry.code, store, counted_at:saved.counted_at || new Date().toISOString(),
      variance:saved.variance, recount:saved.recount ?? null, held:!!saved.held });
    if(AU.isOff(saved.variance) && saved.recount == null && (RECOUNT_HELD || !saved.held)){
      if(detached) W.re = mkRe({ code:entry.code, id:saved.id });
      else {
        // an IMMEDIATE blind recount of every stack the SKU sits on, starting where you stand
        const others = AU.stacksOfCode(S.stk.idx.get(store).byCode, entry.code).filter((n)=> n !== atStack);
        W.re = { code:entry.code, id:saved.id, stacks:[atStack, ...others], i:0, phase:'count', vals:{} };
      }
    }
    saveWDraft();
    return true;
  }catch(e){
    W.pendingOp = { kind:'save', code:entry.code, at:atStack, detached:!!detached }; saveWDraft();
    go('walkerr', false, stkErrMsg(e)); return false;
  }
}
async function wRecountSave(){
  const W = S.walk, R = W.re;
  go('saving', false);
  // ⚠ W3 (round 3): the LOST-ANSWER shape, for the recount — the server committed the PATCH
  // and the answer never came back. The guard refuses a second recount for ever, so a blind
  // re-send looped on «العدّة التانية انحفظت» with no way out. A retry READS THE ROW first,
  // and so does a refusal: a recount the server already holds is adopted as the success.
  const readBack = async ()=> ((await rest(`stock_counts?select=id,recount,variance&id=eq.${enc(R.id)}`)) || [])[0] || null;
  try{
    const recount_stacks = {}; let sum = 0;
    for(const n of R.stacks){ const v = R.vals[n]; recount_stacks[n] = v.e ? { q:AU.r3(v.q), e:v.e } : { q:AU.r3(v.q) }; sum += Number(v.q); }
    let back = null;
    if(R.sent){ const srv = await readBack(); if(srv && srv.recount != null) back = [srv]; }
    if(!back){
      R.sent = true; saveWDraft();
      try{
        back = (await rest(`stock_counts?id=eq.${enc(R.id)}`, { method:'PATCH', headers:{ Prefer:'return=representation' },
          body: JSON.stringify({ recount:AU.r3(sum), recount_stacks }) })) || [];
      }catch(e){
        if(!/P0001|انحفظت/.test(String(e.message || e))) throw e;
        const srv = await readBack();
        if(!srv || srv.recount == null) throw e;
        back = [srv];
      }
    }
    // ⚠ an update RLS silently refused comes back as ZERO rows — that is a failure, not a success
    if(!back.length) throw new Error('recount not saved (0 rows)');
    const rc = back[0].recount != null ? Number(back[0].recount) : AU.r3(sum);
    W.saved[R.code] = { id:R.id, off:AU.isOff(back[0].variance) };
    const loc = S.stk.counts.find((r)=> r.id === R.id); if(loc){ loc.recount = rc; loc.variance = back[0].variance; }
    const last = R.stacks[R.stacks.length - 1];
    W.re = W.reQ.length ? mkRe(W.reQ.shift()) : null;
    if(W.re){ saveWDraft(); go('walk', false); return; }
    // ⚠ a recount opened on resume or at the end is NOT the entry at W.pos — stepping past
    // it (wNext) would skip an SKU nobody has answered yet
    if(R.adopted){ wSkipAhead(); saveWDraft(); if(W.pos >= W.list.length){ wFinish(); return; } W.phase = 'go'; go('walk', false); return; }
    saveWDraft(); wNext(last);
  }catch(e){ W.pendingOp = { kind:'recount' }; saveWDraft(); go('walkerr', false, stkErrMsg(e)); }
}
async function wNotHere(){
  const W = S.walk, c = wCur(), u = me();
  go('saving', false);
  try{
    const row = { store:W.store, stack_no:c.stack, code:c.e.code, kind:'not_here', by_name:u.name, created_by:u.id };
    const back = ((await rest('stack_flags', { method:'POST', headers:{ Prefer:'return=representation' },
      body: JSON.stringify([row]) })) || [])[0] || Object.assign({ created_at:new Date().toISOString() }, row);
    S.stk.flags.unshift(back);
    // NO count for this SKU, and its other stacks in this walk are skipped too
    W.skip.push(c.e.code); W.flagged++;
    for(const k of Object.keys(W.vals)) if(k.endsWith('|' + c.e.code)) delete W.vals[k];
    saveWDraft(); wNext(c.stack);
  }catch(e){ W.pendingOp = { kind:'nothere' }; go('walkerr', false, stkErrMsg(e)); }
}
async function wFinish(){
  const W = S.walk;
  for(const u of wUnsaved()){
    if(!(await wSave(u.entry, u.at, true))) return;
    if(W.re) break;
  }
  if(W.re){ saveWDraft(); go('walk', false); return; }
  go('saving', false);
  try{
    const codes = Object.keys(W.saved);
    await closeSession(W.sid, codes.length, codes.filter((c)=> W.saved[c].off).length);
    let base = null;
    if(W.scope.kind === 'baseline'){
      // «جرد أساسي»: a baseline only when EVERY coded stack of the warehouse was counted
      const all = [...S.stk.idx.get(W.store).byCode.keys()].every((c)=> W.saved[c]);
      if(all){
        const u = me(), b = { store:W.store, at:W.sAt, kind:'count', session_id:W.sid, by_name:u.name };
        await rest('warehouse_baselines', { method:'POST', headers:{ Prefer:'return=minimal' }, body: JSON.stringify([b]) });
        S.stk.base.set(W.store, b); base = 'ok';
      } else base = 'no';
    }
    S.walkDone = { n:codes.length, flagged:W.flagged, base, store:W.store };
    clearWDraft(); S.walk = null; go('walkdone', false);
  }catch(e){ W.pendingOp = { kind:'finish' }; go('walkerr', false, stkErrMsg(e)); }
}
async function wRetry(){
  const W = S.walk;
  if(!W){ if(S.pendingStart) return startWalk(S.pendingStart.store, S.pendingStart.scope); S.stack = []; return go('home', false); }
  const op = W.pendingOp; W.pendingOp = null;
  if(!op) return go('walk', false);
  if(op.kind === 'resume') return resumeWalk();
  if(op.kind === 'save'){
    const entry = AU.stackEntryFor(op.code, W.vals, S.stk.idx.get(W.store).byCode);
    if(!entry) return go('walk', false);
    if(!(await wSave(entry, op.at, op.detached))) return;
    if(W.re) return go('walk', false);
    if(op.detached){ wSkipAhead(); if(W.pos >= W.list.length) return wFinish(); return go('walk', false); }
    return wNext(op.at);
  }
  if(op.kind === 'recount') return wRecountSave();
  if(op.kind === 'nothere') return wNotHere();
  if(op.kind === 'finish') return wFinish();
}

/* ── the plan image (private bucket) and the mini-map ── */
function planFor(store){
  const K = S.stk, map = K && K.maps.get(store), path = map && map.plan_path;
  if(!path) return Promise.resolve(null);
  if(K.plan.has(path)) return K.plan.get(path);
  const p = (async ()=>{
    const tk = await getToken();
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/warehouse-maps/${path.split('/').map(enc).join('/')}`,
      { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${tk}` } });
    if(!r.ok) throw new Error('plan ' + r.status);
    const url = URL.createObjectURL(await r.blob());
    await new Promise((res, rej)=>{ const im = new Image(); im.onload = res; im.onerror = ()=> rej(new Error('decode')); im.src = url; });
    return url;
  })().catch(()=>{ K.plan.delete(path); return null; });   // a failure is never cached
  K.plan.set(path, p);
  return p;
}
// the gate formula (DESIGN v2): circle centre = (label centre + dx,dy) × scale, then
// pushed along the inward normal by max(0, (r+4) − wall_d×scale) — off the wall, onto the floor
function discAt(row, Wp, Hp, s, r){
  r = r || WP_R;
  const lx = row.x * Wp * s, ly = row.y * Hp * s;
  const dx = Number(row.dx || 0), dy = Number(row.dy || 0);
  let cx = (row.x * Wp + dx) * s, cy = (row.y * Hp + dy) * s;
  const push = Math.max(0, (r + 4) - Number(row.wall_d || 0) * s);
  const nv = { N:[0,-1], S:[0,1], E:[1,0], W:[-1,0] }[row.side] || [0,0];
  cx += nv[0] * push; cy += nv[1] * push;
  return { cx, cy, lx, ly, lead: !!(dx || dy) };
}
function discSvg(x, y, n, o){
  o = o || {};
  const r = o.r || WP_R;
  const fs = Math.round((String(n).length >= 3 ? 17 : 20) * r / WP_R);
  return (o.lead ? `<line x1="${x}" y1="${y}" x2="${o.lead.x}" y2="${o.lead.y}" stroke="#1C1813" stroke-width="1"/>
      <circle cx="${o.lead.x}" cy="${o.lead.y}" r="2.5" fill="#1C1813"/>` : '')
    + `<circle cx="${x}" cy="${y}" r="${r + 3}" fill="#fff"/>`
    + `<circle cx="${x}" cy="${y}" r="${r}" fill="#1C1813"/>`
    + `<text x="${x}" y="${y}" fill="#fff" font-size="${fs}" font-weight="700" text-anchor="middle"
        dominant-baseline="central" font-family="IBM Plex Sans Arabic, Segoe UI, system-ui, sans-serif">${esc(n)}</text>`;
}
async function drawMinis(){
  const els = [...document.querySelectorAll('.mmap[data-stack]')];
  for(const el of els){
    const store = el.getAttribute('data-store'), n = Number(el.getAttribute('data-stack'));
    const K = S.stk, map = K && K.maps.get(store), row = K && K.rows.get(store) && K.rows.get(store).get(n);
    el.classList.remove('fail');
    el.innerHTML = `<div class="mmwait"><span>${t('map_loading')}</span></div>`;
    const url = await planFor(store);
    if(!el.isConnected) continue;
    if(!url || !row || !map.plan_w || !map.plan_h){
      // the numbers on the floor still work without the picture — say so and carry on
      el.classList.add('fail');
      el.innerHTML = `<div class="mmwait"><span>⚠️ ${t('map_fail',{ n: ltr(n) })}</span></div>`;
      continue;
    }
    const Wp = map.plan_w, Hp = map.plan_h, s = MINI_SCALE, cw = el.clientWidth, ch = el.clientHeight;
    const d = discAt(row, Wp, Hp, s, MINI_R);
    let left = cw/2 - d.cx, top = ch/2 - d.cy;
    left = Math.min(MINI_MARGIN, Math.max(cw - Wp*s - MINI_MARGIN, left));
    top  = Math.min(MINI_MARGIN, Math.max(ch - Hp*s - MINI_MARGIN, top));
    el.innerHTML = `<img src="${url}" alt="" style="left:${left}px;top:${top}px;width:${Wp*s}px;height:${Hp*s}px">`
      + `<svg width="${cw}" height="${ch}" viewBox="0 0 ${cw} ${ch}">${discSvg(d.cx + left, d.cy + top, n,
          { r:MINI_R, lead: d.lead ? { x:d.lx + left, y:d.ly + top } : null })}</svg>`;
  }
}
const miniMap = (store, n) => `<div class="mmap" data-store="${esc(store)}" data-stack="${esc(n)}"></div>`;

/* ── the expression keypad («17×48+5»): staff count cartons; the device multiplies ── */
function padPress(p, d, mode){
  if(d === 'del') return '';
  if(p.length >= 24) return p;
  if(mode === 'int'){ if(!/^\d$/.test(d) || p.length >= 4) return p; return (p === '0' ? '' : p) + d; }
  if(d === '×' || d === '+') return p && !/[×+.]$/.test(p) ? p + d : p;
  const term = p.split(/[×+]/).pop();
  if(d === '.') return term.includes('.') ? p : p + (term === '' ? '0.' : '.');
  return term === '0' ? p.slice(0, -1) + d : p + d;
}
function exprInner(p){
  if(!p) return '—';
  if(!/[×+]/.test(p)) return esc(p);
  const v = AU.evalCount(p);
  return `<span class="ex">${esc(p)}</span>${v != null ? `<span class="eqv">= ${esc(v)}</span>` : ''}`;
}
function refreshExpr(btnId){
  const box = document.getElementById('numbox');
  box.innerHTML = exprInner(PAD); box.classList.toggle('empty', !PAD);
  box.classList.toggle('exm', /[×+]/.test(PAD));
  box.style.fontSize = PAD.length > 11 ? Math.max(18, 40 - PAD.length) + 'px' : '';
  const b = document.getElementById(btnId); if(b) b.disabled = AU.evalCount(PAD) == null;
}
function refreshInt(btnId){
  const box = document.getElementById('numbox');
  box.textContent = PAD || '—'; box.classList.toggle('empty', !PAD);
  const b = document.getElementById(btnId); if(b) b.disabled = PAD === '';
}

// ⚠ W7 (round 3): what ANOTHER tablet finished today. The boot's snapshot goes stale in
// minutes on a floor with two counters: the door's progress and the walk's skip-set read it.
// Today's rows (Damascus midnight on) and today's «مو هون» reports are read again before a
// morning walk opens, when home is drawn (at most every 20 s) and when the tablet wakes.
let TODAY_AT = 0, OPENING = false;
const todayStart = () => new Date(`${AU.damascusDay()}T00:00:00+03:00`).toISOString();
const pauseMs = (ms) => new Promise((r)=> setTimeout(r, ms));
function refreshToday(stores, force){
  const K = S.stk; if(!K || !stores.length) return Promise.resolve(false);
  // throttled: a skipped call resolves FALSE (never a stale promise — home redraws on true)
  if(!force && Date.now() - TODAY_AT < 20000) return Promise.resolve(false);
  TODAY_AT = Date.now();
  const IN = inList(stores), since = enc(todayStart());
  return Promise.all([
    restAll(`stock_counts?select=id,code,store,counted_at,variance,recount,held,resolution_kind&store=${IN}&counted_at=gte.${since}`),
    restAll(`stack_flags?select=*&store=${IN}&kind=eq.not_here&resolved_at=is.null&created_at=gte.${since}`),
  ]).then(([cs, fl])=>{
    if(S.stk !== K) return false;
    let changed = false;
    for(const r of cs || []){
      const loc = K.counts.find((x)=> x.id === r.id);
      if(!loc){ K.counts.unshift(r); changed = true; }
      else if(loc.variance !== r.variance || loc.recount !== r.recount || !!loc.held !== !!r.held){ Object.assign(loc, r); changed = true; }
    }
    for(const f of fl || []) if(!K.flags.some((x)=> x.id === f.id)){ K.flags.unshift(f); changed = true; }
    return changed;
  }).catch((e)=>{ console.warn('today:', errText(e)); return false; });
}
function refreshHomeBg(force){
  const ss = stackStores(); if(!ss.length) return;
  refreshToday(ss, force).then((changed)=>{ if(changed && (S.screen === 'home' || S.screen === 'stkscope')) render(); });
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') refreshHomeBg(true); });
async function openCycle(store){
  if(OPENING) return;                       // a second tap while today's rows are read
  OPENING = true;
  try{
    // bounded: a slow read never holds the walk — it opens on the snapshot it has
    await Promise.race([refreshToday([store], true), pauseMs(4000)]);
    await openCycleNow(store);
  }finally{ OPENING = false; }
}
async function openCycleNow(store){
  const d = readWDraft();
  if(d && d.store === store && d.scope.kind === 'cycle'){ resumeWalk(); return; }
  // the queue is made lazily (D10) — a tap that beats it waits for it
  if(!S.stk.cycle.has(store)){
    go('boot', false);
    await cycleBg(store);
    if(!S.stk.cycle.has(store)){ S.stack = []; go('home', false); return; }
  }
  startWalk(store, { kind:'cycle', day:AU.damascusDay() });
}

   hides. «شو على الكومة» → «شيل» → «مواد بلا كومة» used to read it in three taps. The

   stack in the last 30 days; approvers see it (their screens show the expected anyway).
   Round 3 (W6): the removal is LOGGED ON THE SERVER — phase33 writes a closed stack_flags
   row (kind 'removed') whenever an SKU leaves a stack, and loadStacks reads the last 30
   days of it — so a second tablet, a phone, or this tablet after its site data is cleared
   hides the quantity too. This device's own log (below) is only the instant answer between
   its «شيل» and the next read. */
const UNSTK_KEY = 'lw_wh_unstacked_v1';
function unstackedLog(){ try{ return JSON.parse(localStorage.getItem(UNSTK_KEY) || '{}') || {}; }catch{ return {}; } }
function noteUnstacked(store, code){
  try{
    const l = unstackedLog(), cut = Date.now() - 30*86400000;
    for(const k of Object.keys(l)) if(l[k] < cut) delete l[k];
    l[store + '|' + code] = Date.now();
    localStorage.setItem(UNSTK_KEY, JSON.stringify(l));
  }catch{}
}
// null = show it; otherwise the words for why it is hidden
function qtyHidden(store, code){
  if(S.isApprover) return null;
  if((S.stk.removed || []).some((f)=> f.store === store && f.code === code)) return 'smap_hidden_off';
  if(unstackedLog()[store + '|' + code]) return 'smap_hidden_off';
  return S.stk.counts.some((r)=> r.store === store && r.code === code) ? 'smap_hidden' : null;
}
function unstacked(store){
  const ix = S.stk.idx.get(store), out = [];
  for(const it of S.items || []){
    const q = AU.stockAt(it, store);
    if(!(q > 0) || ix.byCode.has(it.code)) continue;
    const hide = qtyHidden(store, it.code);
    out.push({ code:it.code, name:it.name, unit:it.unit, image_url:it.image_url || null,
               qty: hide ? null : AU.r3(q), hide, _q:q });
  }
  return out.sort((a,b)=> b._q - a._q);
}

/* ═════ APPROVERS: «⚖️ الفروقات» — the ledger of a stack store ═════ */
async function loadLedger(store){
  const [rows, flags] = await Promise.all([
    restAll(`stock_ledger?select=*&store=eq.${enc(store)}&state=neq.clean&order=counted_at.desc`),
    restAll(`stack_flags?select=*&store=eq.${enc(store)}&resolved_at=is.null&order=created_at.desc`),
  ]);
  S.led = { store, rows, flags };
  S.stk.flags = [...S.stk.flags.filter((f)=> f.store !== store), ...flags];
  S.stk.ledN.set(store, rows.filter((r)=> r.state === 'to_approve' || r.state === 'held').length);
}
async function openLedger(store){
  S.ledStore = store; go('saving');
  try{ await loadLedger(store); S.stack.pop(); go('ledger', false); S.stack.push('problems'); }
  catch(e){ S.stack.pop(); go('problems', false, stkErrMsg(e)); }
}
// a server timestamp (UTC on the wire) in DAMASCUS wall-clock time — the same day key the
// app's own logic uses (AU.damascusDay); a count at 01:30 on the 28th reads the 28th
function dmStamp(iso, withTime){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return String(iso).slice(0, withTime ? 16 : 10).replace('T', ' ');
  if(!withTime) return AU.damascusDay(d);
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Damascus', hour:'2-digit',
      minute:'2-digit', hourCycle:'h23' }).formatToParts(d).map((x)=> [x.type, x.value]));
    return `${AU.damascusDay(d)} ${p.hour}:${p.minute}`;
  }catch{ const z = new Date(d.getTime() + 3*3600000).toISOString(); return `${z.slice(0,10)} ${z.slice(11,16)}`; }
}
