      <button class="big${cnt ? (tone || ' warnbtn') : ''}" data-lk="${id}" ${cnt ? '' : 'disabled'}>
        <span class="ic">${ic}</span><span class="tx">${t('led_'+k)}<span class="sub">${t('led_'+k+'_sub')}</span></span>
        <span class="n">${cnt}</span></button>`;
    const b = S.stk.base.get(L.store);
    return `
      <p class="ask">${t('led_title')}</p><p class="askwhy">${bdi(L.store)}</p>
      ${msgHtml()}
      <div class="sumstrip">
        <div class="sumcell loss"><span class="lb">${t('led_loss')} · ${ltr(s.lossN)}</span><span class="fig">${money(s.loss)}</span></div>
        <div class="sumcell gain"><span class="lb">${t('led_gain')} · ${ltr(s.surplusN)}</span><span class="fig">${money(s.surplus)}</span></div>
      </div>
      ${s.unvalued ? `<div class="note warn">${t('led_unvalued',{ n:s.unvalued })}</div>` : ''}
      ${card('approve','⚖️','approve',n('approve'))}
      ${card('held','⏸️','held',n('held'))}
      ${card('flags','📣','flags',L.flags.length)}
      ${card('post','🖊️','post',n('post'),' calm')}
      ${card('unver','🔁','unver',n('unver'),' calm')}
      <button class="big" data-lk="base"><span class="ic">🧱</span>
        <span class="tx">${t('led_base')}<span class="sub">${b ? `${t('base_last')}: ${ltr(dmStamp(b.at))} · ${t(b.kind === 'count' ? 'base_count' : 'base_declared')}` : t('base_none')}</span></span>
        <span class="go">${FWD()}</span></button>
      <button class="big" data-lk="cycle"><span class="ic">🌅</span>
        <span class="tx">${t('led_cycle')}<span class="sub">${cycleCapText(L.store)}</span></span>
        <span class="go">${FWD()}</span></button>`;
  },
  wire(){ document.querySelectorAll('[data-lk]').forEach((b)=>{ b.onclick = ()=>{ S.ledKind = b.getAttribute('data-lk'); S.res = {}; go('ledlist'); }; }); },
};
function cycleCapText(store){
  const K = S.stk, map = K.maps.get(store), ix = K.idx.get(store);
  const cap = AU.cycleCapacity(ix.byStack, AU.storeAbc(S.items, store, [...ix.byCode.keys()]), map.due_days, Number(map.cycle_per_day) || 8);
  return t(cap.ok ? 'cap_ok' : 'cap_bad', { need:ltr(cap.need), per:ltr(cap.perDay) });
}
// a row waiting on a decision or on Qusay: its figure is the one that will be POSTED
const pendingRow = (r) => (r.state === 'to_approve' || r.state === 'to_post') && r.to_post != null;
function ledRowHtml(r, extra){
  const v = Number(r.variance || 0), pend = pendingRow(r);
  const d = pend ? Number(r.to_post) : v;
  const val = pend ? Math.round(d * Number(r.cost || 0) * 100) / 100 : r.value;
  const stacks = stackList(Object.keys(r.stacks || {}));
  return `<div class="row">
    <div class="rowtop"><span class="rowname">${esc(r.name || r.code)}</span>
      <span class="figure ${d < 0 ? 'bad' : 'good'}">${signed(d)}</span></div>
    ${pend && Math.abs(d - v) > 0.0005 ? `<div class="rowsub">${t('led_carry', { v:signed(v), g:signed(d) })}</div>` : ''}
    <div class="rowsub">${ltr(r.code)}${stacks ? ` · ${t('stk')} ${stacks}` : ''} · ${t('led_expected')} ${ltr(r.expected)} · ${t('led_counted')} ${ltr(r.counted)}</div>
    <div class="rowsub">${esc(r.counted_by_name || '')} · ${ltr(dmStamp(r.counted_at))}${Number(r.cost) > 0 ? ` · ${t('led_value')} ${money(val)}` : ''}</div>
    ${extra || ''}</div>`;
}
SCREENS.ledlist = {
  back:true, title(){ return t('led_' + S.ledKind); },
  html(){
    const L = S.led, k = S.ledKind;
    const head = `<p class="ask">${t('led_'+k)}</p>${t('led_'+k+'_sub') !== 'led_'+k+'_sub' ? `<p class="askwhy">${t('led_'+k+'_sub')}</p>` : ''}${msgHtml()}`;
    if(k === 'approve'){
      const RES = ['miscount','bill','damaged','missing','adjust'];
      const rows = L.rows.filter((r)=> r.state === 'to_approve');
      return head + (rows.map((r)=>{ const e = S.res[r.id] || {};
        return ledRowHtml(r, `<div class="rowsub" style="margin-top:8px">${t('res_ask')}</div>
          <div class="reschips">${RES.map((x)=> `<button class="res tall${e.kind === x ? ' on' : ''}" data-res="${esc(r.id)}" data-kind="${x}">${t('res_'+x)}</button>`).join('')}</div>
          <button class="savebtn tall" data-save="${esc(r.id)}" ${e.kind ? '' : 'disabled'}>${t('res_save')}</button>`); }).join('')
        || `<div class="note good">${t('led_empty')}</div>`);
    }
    if(k === 'held'){
      const rows = L.rows.filter((r)=> r.state === 'held');
      return head + (rows.map((r)=> ledRowHtml(r, `<div class="note warn" style="margin:10px 0 0">${t('held_why')} ${esc(r.held_why || '—')}</div>
          <button class="rowact go" data-held="${esc(r.id)}">${t('held_ok')}</button>`)).join('')
        || `<div class="note good">${t('led_empty')}</div>`);
    }
    if(k === 'post' || k === 'unver'){
      const rows = L.rows.filter((r)=> r.state === LEDK[k]);
      return head + (rows.map((r)=> ledRowHtml(r, k === 'post'
          ? `<div class="rowsub">${t('res_ask')} ${esc(r.resolution || r.resolution_kind || '')} · ${t('led_to_post')} ${signed(r.to_post)}</div>` : '')).join('')
        || `<div class="note good">${t('led_empty')}</div>`);
    }
    if(k === 'flags'){
      return head + (L.flags.map((f)=>{ const it = itemOf(f.code);
        return `<div class="row"><div class="rowtop"><span class="rowname">${t('stk')} ${ltr(f.stack_no)} — ${t(f.kind === 'short' ? 'flag_short' : 'flag_not_here')}</span></div>
          <div class="rowsub">${f.code ? esc(it.name || f.code) : '—'}</div>
          <div class="rowsub">${t('flag_by')}: ${esc(f.by_name || '')} · ${ltr(dmStamp(f.created_at, true))}</div>
          <button class="rowact" data-flag="${esc(f.id)}">✓ ${t('flag_done')}</button></div>`; }).join('')
        || `<div class="note good">${t('led_empty')}</div>`);
    }
    if(k === 'base'){
      const b = S.stk.base.get(L.store);
      return `<p class="ask">${t('led_base')}</p><p class="askwhy">${bdi(L.store)}</p>${msgHtml()}
        <div class="row"><div class="rowname">${b ? t('base_last') : t('base_none')}</div>
          ${b ? `<div class="rowsub">${ltr(dmStamp(b.at, true))} · ${t(b.kind === 'count' ? 'base_count' : 'base_declared')}${b.by_name ? ' · ' + esc(b.by_name) : ''}</div>` : ''}</div>
        <div class="note">${t('base_confirm')}</div>
        <button class="big warnbtn" id="setbase"><span class="ic">🧱</span><span class="tx">${t('base_set')}</span></button>`;
    }
    if(k === 'cycle'){
      const row = S.stk.cycle.get(L.store);
      return `<p class="ask">${t('led_cycle')}</p><p class="askwhy">${bdi(L.store)}</p>${msgHtml()}
        <div class="note">${cycleCapText(L.store)}</div>
        <div class="row"><div class="rowname">${t('cyc_today')}</div>
          <div class="rowsub">${row && (row.stacks || []).length ? stackList(row.stacks) : t('cyc_today_none')}</div></div>
        <button class="big warnbtn" id="reroll"><span class="ic">🔄</span><span class="tx">${t('cyc_reroll')}</span></button>`;
    }
    return '';
  },
  wire(){
    const L = S.led, store = L.store;
    const act = async (btn, fn)=>{ btn.disabled = true; btn.textContent = t('saving');
      try{ await fn(); await loadLedger(store); S.msg = ''; render(); }
      catch(e){ S.msg = errText(e); render(); } };
    document.querySelectorAll('[data-res]').forEach((b)=>{
      b.onclick = ()=>{ const id = b.getAttribute('data-res'); S.res[id] = { kind:b.getAttribute('data-kind') }; render(); };
    });
    document.querySelectorAll('[data-save]').forEach((b)=>{
      b.onclick = ()=>{ const id = b.getAttribute('data-save'), e = S.res[id]; if(!e || !e.kind) return;
        // the reason is written as a PAIR: the label Qusay reads, and the kind the server keys on
        act(b, ()=> rest(`stock_counts?id=eq.${enc(id)}`, { method:'PATCH', body: JSON.stringify({
          resolution: DICT.ar['res_' + e.kind], resolution_kind: e.kind,
          resolved_by: me().name, resolved_at: new Date().toISOString() }) })); };
    });
    document.querySelectorAll('[data-held]').forEach((b)=>{
      b.onclick = ()=> act(b, ()=> rest(`stock_counts?id=eq.${enc(b.getAttribute('data-held'))}`,
        { method:'PATCH', body: JSON.stringify({ held:false }) }));
    });
    document.querySelectorAll('[data-flag]').forEach((b)=>{
      b.onclick = ()=> act(b, ()=> rest(`stack_flags?id=eq.${enc(b.getAttribute('data-flag'))}`,
        { method:'PATCH', body: JSON.stringify({ resolved_at:new Date().toISOString(), resolved_by:me().name }) }));
    });
    const sb = document.getElementById('setbase');
    if(sb) sb.onclick = ()=>{
      const open = L.rows.filter((r)=> r.state === 'to_post' || r.state === 'to_approve');
      const msg = (open.length ? t('base_open',{ n:open.length }) + '\n' + open.slice(0,12).map((r)=> '• ' + (r.name || r.code)).join('\n') + '\n\n' : '') + t('base_confirm');
      if(!confirm(msg)) return;
      act(sb, async ()=>{
        const u = me(), b = { store, at:new Date().toISOString(), kind:'declared', by_name:u.name, note:t('base_set') };
        await rest('warehouse_baselines', { method:'POST', headers:{ Prefer:'return=minimal' }, body: JSON.stringify([b]) });
        S.stk.base.set(store, b);
      });
    };
    const rr = document.getElementById('reroll');
    if(rr) rr.onclick = ()=>{
      if(!confirm(t('cyc_reroll_confirm'))) return;
      act(rr, async ()=>{
        await rest(`cycle_days?store=eq.${enc(store)}&day=eq.${AU.damascusDay()}`, { method:'DELETE' });
        S.stk.cycle.delete(store); S.stk.cycleErr.delete(store);
        await cycleBg(store);                  // bounded by STK_TIMEOUT, like the morning door
        if(!S.stk.cycle.has(store)) throw new Error(S.stk.cycleErr.get(store) || t('err'));
      });
    };
  },
};

/* ───────────────────────── boot ───────────────────────── */
document.getElementById('back').onclick = back;
document.getElementById('langbtn').onclick = ()=>{
  LANG = LANG === 'ar' ? 'en' : 'ar';
  try{ localStorage.setItem(LANG_KEY, LANG); }catch{}
  render();
};

(async function init(){
  render();
  if(!savedAuth()){ go('login', false); return; }
  try{
    await loadAll();
    // ⚠ D10 (round 2): the boot is HEAD's — home is drawn after loadAll and one
    // stock_counts read. The stack loads start here and run BEHIND it (never awaited):
    // a slow or hung phase33 read can no longer hold the rack flows hostage.
    startStacks();
    try{
      const v = await restAll('stock_counts?select=*&resolution=is.null&variance=neq.0&order=counted_at.desc');
      S.openVarAll = AU.openVariances(v);
    }catch(e){ S.openVarAll = []; }
    applyOpenVar();
    S.probs = null;
    go('home', false);
    kickCycles();          // stacks that landed before the home screen: their queue starts now
  }catch(e){
    if(String(e.message) === 'no-session'){ go('login', false); return; }
    S.msg = errText(e);
    document.getElementById('app').innerHTML =
      `<div class="doneicon">😕</div><p class="donebig">${t('err')}</p>${msgHtml()}`;
  }
})();
</script>
