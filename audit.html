<title>Lightware — الجرد</title>
<!--
  «الجرد» — stock counting, shelf mapping and management exceptions.
  9 Sep 2026. MOVED HERE FROM THE ORDER PORTAL, and rebuilt, on Samir's
  instruction: «our warehouse employees have very low digital literacy and
  struggle with standard mobile interfaces». The portal is a dense four-tab
  document tool built for Qusay and Amr; the people who walk the racks use the
  warehouse app, so the work moved to them.

  ⚠ THE UX RULE THIS PAGE IS BUILT AROUND: ONE QUESTION PER SCREEN.
  No tabs, no dashboards, no side-by-side panels, nothing to scroll past to
  find the thing you need. Every screen asks exactly one thing, in words a
  person who does not use apps can read, with one obvious button to answer it.
  Counting is one ITEM per screen — a big photograph, the name, and a keypad —
  instead of a 40-row table of tiny inputs. Tap targets are ≥64px because a
  warehouse hand is not a stylus.

  ⚠ THE BLIND-COUNT RULE IS UNCHANGED AND LOAD-BEARING: the counter never sees
  the expected quantity. A count that can see the answer anchors on the screen
  instead of on the shelf. audit_engine.js's countList() carries no quantity at
  all, and no counting screen here renders one.

  ⚠ THE PIN IS GONE. The portal's per-profile PIN was retired in the same move;
  attribution here is the warehouse login itself — every count row carries the
  signed-in user's id and display name.

  Ships beside index.html on warehouse.lightwaresy.com, behind the same login
  (localStorage lw_dash_auth — one sign-in serves every page). Zero
  dependencies and no build step, like the rest of this app: audit_engine.js
  carries the rules and this file carries the fetches and the screens.
-->
<style>
  :root{
    --ink:#1C1813; --paper:#F8F4EC; --amber:#E8870B; --amber-2:#F09A22;
    --card:#FFFFFF; --line:#E4DBC8; --muted:#776E5E;
    --cream:#F6F1E7; --chrome:#262019; --chrome-line:#3D352A;
    --good:#1E7A45; --good-bg:#E6F4EB; --bad:#B3261E; --bad-bg:#FBE9E7;
    --warn:#8A5A00; --warn-bg:#FDF0DA;
    --tap:64px;                 /* the floor for anything you press */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:17px/1.6 "IBM Plex Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* ── chrome ── */
  header{
    position:sticky; top:0; z-index:20; background:var(--chrome); color:#FCEDD8;
    border-bottom:1px solid var(--chrome-line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    display:flex; align-items:center; gap:10px;
  }
  .back{
    width:48px; height:48px; flex:none; border-radius:14px; border:1px solid var(--chrome-line);
    background:#31291F; color:#FCEDD8; font-size:24px; line-height:1; cursor:pointer;
  }
  .htitle{flex:1; font-size:19px; font-weight:800; text-align:center}
  .hbtn{
    min-width:48px; height:48px; padding:0 12px; border-radius:14px; font-size:15px; font-weight:700;
    border:1px solid var(--chrome-line); background:#31291F; color:#FCEDD8; cursor:pointer;
  }
  main{padding:16px 14px 32px; max-width:640px; margin:0 auto}

  /* ── the one question ── */
  .ask{font-size:24px; font-weight:800; line-height:1.35; margin:6px 0 4px}
  .ask.q{font-size:18px; margin:2px 0 6px}
  .askwhy{color:var(--muted); font-size:16px; margin:0 0 18px}

  /* ── big choice buttons: the primary interaction of the whole page ── */
  .big{
    display:flex; align-items:center; gap:14px; width:100%; min-height:var(--tap);
    padding:16px 18px; margin-bottom:12px; border-radius:18px; cursor:pointer;
    background:var(--card); border:2px solid var(--line); color:var(--ink);
    font:inherit; font-size:20px; font-weight:700; text-align:start; text-decoration:none;
  }
  .big:active{transform:scale(.985)}
  .big .ic{font-size:30px; line-height:1; flex:none}
  .big .tx{flex:1; min-width:0}
  .big .sub{display:block; font-size:14px; font-weight:600; color:var(--muted); margin-top:2px}
  .big .go{font-size:24px; color:var(--muted); flex:none}
  .big.on{border-color:var(--amber); background:#FFF7EC}
  .big.hero{
    background:linear-gradient(180deg,var(--amber-2),var(--amber)); border-color:var(--amber);
    color:#fff; font-size:22px; justify-content:center; min-height:68px;
    box-shadow:0 6px 0 #C4740A;
  }
  .big.hero .sub{color:#FFF1DC}
  .big.hero:active{box-shadow:0 2px 0 #C4740A; transform:translateY(4px)}
  .big.calm{background:var(--cream)}
  .big.warnbtn{border-color:#E7C48A; background:var(--warn-bg)}
  .big[disabled]{opacity:.42; box-shadow:none; cursor:default}
  .actrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:8px; margin-bottom:10px}
  .act{
    min-height:58px; border-radius:16px; border:2px solid var(--line); background:var(--cream);
    font:inherit; font-size:15px; font-weight:700; color:var(--ink); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; line-height:1.15;
  }
  .act:active{background:#EFE8DA}
  .act .ic{font-size:19px}
  .quitlink{
    display:block; width:100%; margin-top:14px; padding:12px; border:none; background:none;
    font:inherit; font-size:15px; font-weight:700; color:var(--muted); text-decoration:underline; cursor:pointer;
  }
  .big .n{
    font-size:15px; font-weight:800; padding:4px 12px; border-radius:999px;
    background:var(--cream); color:var(--ink); flex:none;
  }
  .big.warnbtn .n{background:#F4DDB4}

  /* ── the item being counted / mapped ── */
  .itemcard{display:flex; gap:12px; align-items:center; margin-bottom:12px}
  .shot{
    width:92px; height:92px; flex:none; border-radius:20px; background:var(--cream);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .itemcard .body{flex:1; min-width:0}
  .shot img{max-width:100%; max-height:100%; object-fit:contain}
  .shot .noimg{font-size:44px; opacity:.35}
  .iname{font-size:19px; font-weight:800; line-height:1.3; margin:0 0 6px; overflow-wrap:anywhere}
  .imeta{display:flex; flex-wrap:wrap; gap:8px}
  .tag{
    font-size:15px; font-weight:700; padding:6px 12px; border-radius:999px;
    background:var(--cream); border:1px solid var(--line);
  }
  .tag.shelf{background:var(--warn-bg); border-color:#E7C48A; color:var(--warn)}
  .tag.qty{background:var(--good-bg); border-color:#BFE3CD; color:var(--good)}
  .ltr{direction:ltr; unicode-bidi:isolate; display:inline-block}

  /* ── progress ── */
  .prog{margin:0 0 12px}
  .progbar{height:12px; border-radius:999px; background:var(--line); overflow:hidden}
  .progbar i{display:block; height:100%; background:var(--amber); border-radius:999px; transition:width .2s}
  .progtx{display:flex; justify-content:space-between; font-size:15px; font-weight:700; color:var(--muted); margin-top:6px}

  /* ── the number pad ── */
  .num{
    height:72px; border-radius:20px; border:2px solid var(--line); background:var(--card);
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
    font-size:38px; font-weight:800; direction:ltr; font-variant-numeric:tabular-nums;
  }
  .num.empty{color:#C7BDA8}
  /* ⚠ direction:ltr is DELIBERATE — see the note in the head comment. */
  .pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; direction:ltr}
  .key{
    height:58px; border-radius:16px; border:2px solid var(--line); background:var(--card);
    font:inherit; font-size:28px; font-weight:800; cursor:pointer; color:var(--ink);
  }
  .key:active{background:var(--cream)}
  .key.plus{background:var(--good-bg); border-color:#BFE3CD; color:var(--good); font-size:24px}
  .key.del{background:var(--bad-bg); border-color:#F0C8C4; color:var(--bad); font-size:18px}

  /* ── notes, states ── */
  .note{
    border-radius:16px; padding:14px 16px; margin:0 0 14px; font-size:16px; font-weight:600;
    background:var(--cream); border:1px solid var(--line);
  }
  .note.warn{background:var(--warn-bg); border-color:#E7C48A; color:var(--warn)}
  .note.bad{background:var(--bad-bg); border-color:#F0C8C4; color:var(--bad)}
  .note.good{background:var(--good-bg); border-color:#BFE3CD; color:var(--good)}
  .state{padding:40px 10px; text-align:center; color:var(--muted); font-size:18px}

  /* ── the finish screen ── */
  .doneicon{font-size:76px; text-align:center; margin:18px 0 6px}
  .donebig{font-size:27px; font-weight:800; text-align:center; margin-bottom:8px}
  .donesub{text-align:center; color:var(--muted); font-size:17px; margin-bottom:22px}

  /* ── manager lists (denser is allowed here — this screen is for Amr/Qusay) ── */
  .row{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; margin-bottom:10px;
  }
  .rowtop{display:flex; gap:10px; align-items:baseline; justify-content:space-between}
  .rowname{font-weight:700; font-size:17px}
  .rowsub{color:var(--muted); font-size:14px; margin-top:2px}
  .figure{font-weight:800; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate}
  .figure.bad{color:var(--bad)} .figure.good{color:var(--good)}
  .reschips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
  .res{
    min-height:48px; padding:10px 16px; border-radius:14px; border:2px solid var(--line);
    background:var(--cream); font:inherit; font-size:16px; font-weight:700; cursor:pointer;
  }
  .res.on{border-color:var(--amber); background:#FFF7EC}
  .savebtn{
    width:100%; min-height:56px; margin-top:12px; border-radius:16px; border:none;
    background:var(--amber); color:#fff; font:inherit; font-size:18px; font-weight:800; cursor:pointer;
  }
  .savebtn[disabled]{opacity:.4}

  /* ── login ── */
  .login input{
    width:100%; min-height:var(--tap); margin-bottom:12px; padding:0 16px; font:inherit; font-size:18px;
    border-radius:16px; border:2px solid var(--line); background:var(--card); direction:ltr;
  }
  @media (max-width:380px){ .ask{font-size:21px} .big{font-size:18px} .key{height:60px} }
</style>

/* ───────────────────────── auth (shared with index.html) ───────────────────────── */
function savedAuth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch{ return null; } }
async function getToken(){
  let a = savedAuth();
  if(!a) return null;
  if(a.expires_at*1000 > Date.now()+60000) return a.access_token;
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST', headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token:a.refresh_token})
  });
  if(!r.ok){ localStorage.removeItem(AUTH_KEY); return null; }
  a = await r.json(); localStorage.setItem(AUTH_KEY, JSON.stringify(a));
  return a.access_token;
}
function me(){
  const a = savedAuth();
  const u = a && a.user ? a.user : null;
  const md = u && u.user_metadata ? u.user_metadata : {};
  return { id: u ? u.id : null, name: md.name || (u ? String(u.email||'').split('@')[0] : ''), email: u ? u.email : '' };
}

/* ───────────────────────── REST ─────────────────────────
   ⚠ Every read is PAGED. PostgREST caps a response at 1000 rows on this
   instance, so a bare select silently truncates once a table outgrows it — and
   a short count list looks exactly like «those items are not here». */
async function rest(path, opts){
  const tk = await getToken();
  if(!tk) throw new Error('no-session');
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: SUPABASE_ANON_KEY, Authorization:`Bearer ${tk}`, 'Content-Type':'application/json',
    }, (opts && opts.headers) || {}),
  }));
  if(!r.ok){ const b = await r.text(); const e = new Error(b || ('HTTP '+r.status)); e.status = r.status; throw e; }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
async function restAll(path){
  const out = [];
  for(let from=0;;from+=1000){
    const tk = await getToken();
    if(!tk) throw new Error('no-session');
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers:{
      apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${tk}`, Range:`${from}-${from+999}` } });
    if(!r.ok){ const b = await r.text(); const e = new Error(b || ('HTTP '+r.status)); e.status = r.status; throw e; }
    const page = await r.json();
    out.push(...page);
    if(page.length < 1000) break;
  }
  return out;
}

function go(screen, push, msg){
  if(push !== false && S.screen !== screen) S.stack.push(S.screen);
  // ⚠ the message is cleared FIRST and then set from the argument. It used to be
  // cleared unconditionally, which wiped every fail-loud message a fraction of a
  // second before the screen that exists to show it rendered — so «الجداول ناقصة
  // … phase29_stock_counts.sql» became a bare «ما قدرنا نحفظ». Caught by the
  // harness, never by eye: the screen still LOOKED like an error screen.
  S.screen = screen; S.msg = msg || ''; window.scrollTo(0,0); render();
}
function back(){
  const prev = S.stack.pop();
  S.screen = prev || 'home'; S.msg = ''; window.scrollTo(0,0); render();
}

/* ───────────────────────── data ───────────────────────── */
async function loadAll(){
  const cols = 'code,name,latin_name,unit,qty,brand,image_url,cost,stock_by_store,synced_at';
  const [items, locRows, branches, roles] = await Promise.all([
    restAll(`dashboard_items?select=${cols}`),
    restAll('item_locations?select=code,store,loc'),
    restAll('branches?select=id,name,kind,active,stores&order=id'),
    restAll('staff_roles?select=uid,role,branch_id'),
  ]);
  S.items = items;
  const locs = new Map();
  for(const r of locRows){ const l = locs.get(r.code) || []; l.push(r); locs.set(r.code, l); }
  S.locs = locs;
  const uid = me().id;
  const mine = roles.find((r) => r.uid === uid) || null;
  // ⚠ NO ROW = MANAGER, the phase24 default. Every account without a staff_roles
  // row is a manager, which is how the whole team works today.
  S.isManager = !mine || mine.role === 'manager';
  S.branch = mine && mine.role === 'branch' ? (branches.find((b) => b.id === mine.branch_id) || null) : null;
  const allStores = AU.storesSeen(items, []).filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));
  S.stores = AU.visibleStores({ branch:S.branch, branches, allStores });
  S.abc = AU.abcClassify(items);
  try{ S.sessions = await restAll('stock_count_sessions?select=*&order=started_at.desc'); }
  catch(e){ if(AU.TABLE_MISSING.test(String(e.message))) S.sessions = []; else throw e; }
}

/* ── save: expected is computed HERE, server-fresh (the Aug-9 cashbox lesson) ── */
async function doSave(){
  const entries = S.list.map((r)=>({ code:r.code, counted: AU.numOf(S.vals[r.code]), loc:r.loc }))
    .filter((e)=> e.counted != null);
  if(!entries.length){ S.stack=[]; go('home', false); return; }
  S.entries = entries; go('saving', false);
  try{
    const codes = entries.map((e)=>e.code);
    const fresh = [];
    for(let i=0;i<codes.length;i+=100){
      const chunk = codes.slice(i,i+100).map(encodeURIComponent).join(',');
      fresh.push(...await rest(`dashboard_items?select=code,qty,stock_by_store,synced_at&code=in.(${chunk})`));
    }
    const byCode = new Map(fresh.map((r)=>[r.code,r]));
    const syncedAt = fresh.reduce((m,r)=> (r.synced_at && r.synced_at > m ? r.synced_at : m), '') || null;
    const live = await rest(`withdrawals?select=id,kind,status,store,customer,items,processed_at,created_at&status=in.(pending,flagged)&limit=1000`);
    let doneRows = [];
    if(syncedAt) doneRows = await rest(`withdrawals?select=id,kind,status,store,customer,items,processed_at,created_at&status=eq.done&processed_at=gt.${encodeURIComponent(syncedAt)}&limit=1000`);
    const slips = [...live, ...doneRows];
    const pending = AU.pendingMovements(slips, S.store, syncedAt);
    const unattributed = AU.unattributedSlips(slips, syncedAt);

    const u = me();
    const sess = (await rest('stock_count_sessions', { method:'POST', headers:{Prefer:'return=representation'},
      body: JSON.stringify([{ store:S.store, scope:AU.scopeKey(S.scope), started_by:u.id,
        started_by_name:u.name, synced_at:syncedAt,
        ...(S.branch ? { branch_id:S.branch.id } : {}) }]) }))[0];

    const rows = AU.buildCountRows({ sessionId:sess.id, store:S.store, entries, byCode, pending,
      uid:u.id, authorName:u.name });
    const saved = [];
    for(let i=0;i<rows.length;i+=200){
      saved.push(...await rest('stock_counts', { method:'POST', headers:{Prefer:'return=representation'},
        body: JSON.stringify(rows.slice(i,i+200)) }));
    }
    const off = saved.filter((r)=> AU.isOff(r.variance));
    S.result = { session:sess, rows:saved, off, unattributed };
    clearDraft();
    if(off.length){ S.reIdx = 0; S.reVals = {}; PAD=''; go('recount', false); }
    else { await closeSession(sess.id, saved.length, 0); go('done', false); }
    loadAll().catch(()=>{});
  }catch(e){
    const m = String(e.message || e);
    go('saveerr', false, AU.TABLE_MISSING.test(m)
      ? `${t('sql_missing')} ${AU.COUNT_SQL_FILE}` : `${t('save_err')} — ${m.slice(0,140)}`);
  }
}
async function closeSession(id, items, off){
  await rest(`stock_count_sessions?id=eq.${id}`, { method:'PATCH',
    body: JSON.stringify({ status:'closed', closed_at:new Date().toISOString(), items, off }) });
}

SCREENS.saveerr = {
  back:false, title:()=>t('err'),
  html:()=>`<div class="doneicon">😕</div><p class="donebig">${t('save_err')}</p>
    ${msgHtml()}
    <button class="big hero" id="retry">${t('retry')}</button>
    <button class="big calm" id="hm">${t('home_btn')}</button>`,
  wire(){
    document.getElementById('retry').onclick = ()=> doSave();
    document.getElementById('hm').onclick = ()=>{ S.stack=[]; go('home', false); };
  },
};

/* ── recount: the SAME blind screen, only the items that differed ── */
SCREENS.recount = {
  back:false, ltrTitle:true, title(){ return `${S.reIdx+1} / ${S.result.off.length}`; },
  html(){
    const off = S.result.off;
    const r = off[S.reIdx];
    const meta = S.list.find((x)=>x.code === r.code) || { code:r.code, name:r.code };
    const pct = Math.round((S.reIdx / Math.max(1,off.length)) * 100);
    return `
      <p class="ask">${t('re_ask')}</p>
      <div class="note warn">${t('re_why',{n:off.length})}</div>
      <div class="prog"><div class="progbar"><i style="width:${pct}%"></i></div>
        <div class="progtx"><span>${t('of',{a:S.reIdx+1,b:off.length})}</span><span></span></div></div>
      <div class="itemcard">
        <div class="shot">${meta.image_url ? `<img src="${esc(meta.image_url)}" alt="">` : `<span class="noimg">📦</span>`}</div>
        <div class="body">
          <p class="iname">${esc(meta.name || r.code)}</p>
          <div class="imeta"><span class="tag ltr">${esc(r.code)}</span>
            ${meta.loc ? `<span class="tag shelf">📍 ${esc(meta.loc)}</span>` : ''}</div>
        </div>
      </div>
      <p class="ask q">${t('count_ask')}</p>
      ${padHtml(PAD)}
      <button class="big hero" id="next" ${PAD===''?'disabled':''}>${
        S.reIdx === off.length-1 ? t('re_go') : t('next')} ${FWD()}</button>
      <div class="actrow"><button class="act" id="zero"><span class="ic">0️⃣</span>${t('zero_short')}</button></div>`;
  },
  wire(){
    const refresh = ()=>{
      const box = document.getElementById('numbox');
      box.textContent = PAD || '—'; box.classList.toggle('empty', !PAD);
      document.getElementById('next').disabled = PAD === '';
    };
    wirePad(refresh);
    const advance = async (v)=>{
      S.reVals[S.result.off[S.reIdx].code] = v; PAD = '';
      if(S.reIdx < S.result.off.length - 1){ S.reIdx++; render(); }
      else await doRecount();
    };
    document.getElementById('next').onclick = ()=>{ if(PAD!=='') advance(PAD); };
    document.getElementById('zero').onclick = ()=> advance('0');
  },
};

async function doRecount(){
  go('saving', false);
  try{
    const updated = [];
    for(const r of S.result.off){
      const v = AU.numOf(S.reVals[r.code]);
      if(v == null) continue;
      const variance = AU.varianceOf(r.expected, null, v);
      const u = await rest(`stock_counts?id=eq.${r.id}`, { method:'PATCH', headers:{Prefer:'return=representation'},
        body: JSON.stringify({ recount: AU.r3(v), variance }) });
      updated.push(...u);
    }
    const byId = new Map(updated.map((u)=>[u.id,u]));
    const finalRows = S.result.rows.map((r)=> byId.get(r.id) || r);
    const off = finalRows.filter((r)=> AU.isOff(r.variance)).length;
    await closeSession(S.result.session.id, finalRows.length, off);
    S.result = Object.assign({}, S.result, { rows:finalRows, offFinal:off });
    go('done', false);
    loadAll().catch(()=>{});
  }catch(e){ go('saveerr', false, `${t('save_err')} — ${String(e.message).slice(0,140)}`); }
}

/* ── done ── */
SCREENS.done = {
  back:false, title:()=>t('title'),
  html(){
    const r = S.result || { rows:[], off:[] };
    const off = r.offFinal != null ? r.offFinal : r.off.length;
    return `
      <div class="doneicon">${off ? '📋' : '✅'}</div>
      <p class="donebig">${t('done_ok')}</p>
      <p class="donesub">${t('done_sub',{n:r.rows.length})}</p>
      ${off ? `<div class="note warn"><b>${t('done_off',{n:off})}</b><br>${t('done_off_sub')}</div>`
            : `<div class="note good">${t('done_clean')}</div>`}
      ${r.unattributed ? `<div class="note warn">${t('unattributed',{n:r.unattributed})}</div>` : ''}
      <button class="big hero" id="again">${t('again')}</button>
      <button class="big calm" id="hm">${t('home_btn')}</button>`;
  },
  wire(){
    document.getElementById('again').onclick = ()=>{ S.vals={}; PAD=''; S.stack=['home']; S.mode='count'; go('store', false); };
    document.getElementById('hm').onclick = ()=>{ S.stack=[]; go('home', false); };
  },
};

/* ── MAP: one item per screen, and here the quantity IS shown ── */
SCREENS.map = {
  back:true, ltrTitle:true, title(){ return `${Math.min(S.mapIdx+1, S.mapList.length)} / ${S.mapList.length}`; },
  html(){
    if(!S.mapList.length) return `
      <div class="doneicon">✅</div><p class="donebig">${t('map_none')}</p>
      <p class="donesub">${t('map_none_sub')}</p>
      <button class="big hero" id="hm">${t('home_btn')}</button>`;
    if(S.mapIdx >= S.mapList.length) return `
      <div class="doneicon">🎉</div><p class="donebig">${t('map_none')}</p>
      <p class="donesub">${t('map_saved')} — ${S.mapSaved}</p>
      <button class="big hero" id="hm">${t('home_btn')}</button>`;
    const r = S.mapList[S.mapIdx];
    const pct = Math.round((S.mapIdx / Math.max(1,S.mapList.length)) * 100);
    return `
      <div class="prog"><div class="progbar"><i style="width:${pct}%"></i></div>
        <div class="progtx"><span>${t('map_left',{n:S.mapList.length - S.mapIdx})}</span><span>${S.mapSaved} ✓</span></div></div>
      <div class="itemcard">
        <div class="shot">${r.image_url ? `<img src="${esc(r.image_url)}" alt="">` : `<span class="noimg">📦</span>`}</div>
        <div class="body">
          <p class="iname">${esc(r.name || r.code)}</p>
          <div class="imeta"><span class="tag ltr">${esc(r.code)}</span>
            <span class="tag qty">${t('have')} ${ltr(r.qty)}${r.unit ? ' ' + esc(r.unit) : ''}</span></div>
        </div>
      </div>
      <p class="ask q">${t('map_ask')}</p>
      <p class="askwhy">${t('map_why')}</p>
      ${padHtml(PAD)}
      ${msgHtml()}
      <button class="big hero" id="save" ${PAD===''?'disabled':''}>${t('map_save')} ${FWD()}</button>
      <div class="actrow"><button class="act" id="skip"><span class="ic">⏭️</span>${t('map_skip')}</button></div>`;
  },
  wire(){
    const hm = document.getElementById('hm');
    if(hm){ hm.onclick = ()=>{ S.stack=[]; go('home', false); }; return; }
    const refresh = ()=>{
      const box = document.getElementById('numbox');
      box.textContent = PAD || '—'; box.classList.toggle('empty', !PAD);
      document.getElementById('save').disabled = PAD === '';
    };
    wirePad(refresh);
    document.getElementById('skip').onclick = ()=>{ PAD=''; S.mapIdx++; render(); };
    document.getElementById('save').onclick = async ()=>{
      const r = S.mapList[S.mapIdx];
      const loc = AU.composeLoc(PAD, '');
      if(!loc) return;
      const btn = document.getElementById('save'); btn.disabled = true; btn.textContent = t('saving');
      try{
        await rest('item_locations?on_conflict=code,store', { method:'POST',
          headers:{ Prefer:'resolution=merge-duplicates' },
          body: JSON.stringify([{ code:r.code, store:S.store, loc, updated_by:me().name,
            updated_at:new Date().toISOString() }]) });
        const l = S.locs.get(r.code) || []; l.push({ code:r.code, store:S.store, loc }); S.locs.set(r.code, l);
        S.mapSaved++; PAD=''; S.mapIdx++; S.msg=''; render();
      }catch(e){
        S.msg = `${t('save_err')} — ${String(e.message).slice(0,120)}`; render();
      }
    };
  },
};

/* ── PROBLEMS (managers). Still big cards → one list per problem. ── */
function computeProblems(){
  const stale = AU.storeStaleness(S.sessions, S.stores, S.items);
  return {
    neg: AU.negativeStock(S.items),
    stale: stale.filter((s)=>s.stale),
    unmapped: AU.unmappedByStore(S.items, S.locs, S.stores).filter((u)=>u.n>0),
    home: AU.homeStock(S.items, S.stores),
  };
}
SCREENS.problems = {
  back:true, title:()=>t('home_prob'),
  html(){
    if(!S.isManager) return `<p class="ask">${t('mgr_only')}</p>`;
    const p = S.probs || (S.probs = computeProblems());
    const v = S.openVar || [];
    const card = (id, ic, k, n, tone) => `
      <button class="big${n?(tone||' warnbtn'):''}" data-p="${id}" ${n?'':'disabled'}>
        <span class="ic">${ic}</span>
        <span class="tx">${t('p_'+k)}<span class="sub">${t('p_'+k+'_sub')}</span></span>
        <span class="n">${n}</span></button>`;
    const total = v.length + p.neg.length + p.stale.length + p.unmapped.length + p.home.length;
    return `
      <p class="ask">${t('prob_ask')}</p>
      ${total ? '' : `<div class="note good">${t('p_none')}</div>`}
      ${card('var','⚖️','var',v.length)}
      ${card('neg','➖','neg',p.neg.length)}
      ${card('stale','🗓️','stale',p.stale.length)}
      ${card('unmapped','📍','unmapped',p.unmapped.length)}
      ${card('home','🏠','home',p.home.length)}`;
  },
  wire(){
    document.querySelectorAll('[data-p]').forEach((b)=>{
      b.onclick = ()=>{ S.probKind = b.getAttribute('data-p'); go('problist'); };
    });
  },
};

SCREENS.problist = {
  back:true, title(){ return t('p_'+S.probKind); },
  html(){
    const p = S.probs || computeProblems();
    const k = S.probKind;
    if(k === 'var'){
      const rows = S.openVar || [];
      const RES = ['miscount','bill','damaged','missing','adjust'];
      return `<p class="ask">${t('p_var')}</p><p class="askwhy">${t('p_var_sub')}</p>` + rows.map((r)=>{
        const it = (S.items||[]).find((i)=>i.code===r.code) || {};
        const e = S.res[r.id] || {};
        const d = Number(r.variance);
        return `<div class="row" data-var="${esc(r.id)}">
          <div class="rowtop"><span class="rowname">${esc(it.name || r.code)}</span>
            <span class="figure ${d<0?'bad':'good'}">${d<0?'−':'+'}${ltr(Math.abs(d))}</span></div>
          <div class="rowsub">${esc(r.store)} · ${ltr(r.code)} · ${t('var_expected')} ${ltr(r.expected)} · ${t('var_counted')} ${ltr(r.recount != null ? r.recount : r.counted)}</div>
          <div class="rowsub" style="margin-top:8px">${t('res_ask')}</div>
          <div class="reschips">${RES.map((x)=>`<button class="res${e.kind===x?' on':''}" data-res="${esc(r.id)}" data-kind="${x}">${t('res_'+x)}</button>`).join('')}</div>
          <button class="savebtn" data-save="${esc(r.id)}" ${e.kind?'':'disabled'}>${t('res_save')}</button>
        </div>`;
      }).join('') || `<div class="note good">${t('p_none')}</div>`;
    }
    if(k === 'neg') return `<p class="ask">${t('p_neg')}</p><p class="askwhy">${t('p_neg_sub')}</p>` +
      p.neg.map((i)=>`<div class="row"><div class="rowtop"><span class="rowname">${esc(i.name||i.code)}</span>
        <span class="figure bad">−${ltr(Math.abs(i.qty))}</span></div>
        <div class="rowsub">${ltr(i.code)}${i.brand?' · '+esc(i.brand):''}</div></div>`).join('');
    if(k === 'stale') return `<p class="ask">${t('p_stale')}</p><p class="askwhy">${t('p_stale_sub')}</p>` +
      p.stale.map((s)=>`<div class="row"><div class="rowtop"><span class="rowname">${esc(s.store)}</span>
        <span class="figure">${s.days==null?t('never'):t('days_ago',{n:s.days})}</span></div></div>`).join('');
    if(k === 'unmapped') return `<p class="ask">${t('p_unmapped')}</p><p class="askwhy">${t('p_unmapped_sub')}</p>` +
      p.unmapped.map((u)=>`<div class="row"><div class="rowtop">
        <span class="rowname">${u.home?'🏠 ':''}${esc(u.store)}</span>
        <span class="figure">${ltr(u.n)} / ${ltr(u.withStock)}</span></div>
        <div class="rowsub">${t('of_which',{n:u.n})}</div></div>`).join('');
    if(k === 'home') return `<p class="ask">${t('p_home')}</p><p class="askwhy">${t('p_home_sub')}</p>` +
      p.home.map((h)=>`<div class="row"><div class="rowtop"><span class="rowname">🏠 ${esc(h.store)}</span>
        <span class="figure">${h.partial?t('value_floor')+' ':''}${ltr('$'+h.value)}</span></div>
        <div class="rowsub">${t('items_word',{n:h.items})}</div></div>`).join('');
    return '';
  },
  wire(){
    document.querySelectorAll('[data-res]').forEach((b)=>{
      b.onclick = ()=>{
        const id = b.getAttribute('data-res');
        S.res[id] = Object.assign({}, S.res[id], { kind: b.getAttribute('data-kind') });
        render();
      };
    });
    document.querySelectorAll('[data-save]').forEach((b)=>{
      b.onclick = async ()=>{
        const id = b.getAttribute('data-save');
        const e = S.res[id]; if(!e || !e.kind) return;
        b.disabled = true; b.textContent = t('saving');
        try{
          await rest(`stock_counts?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({
            resolution: t('res_'+e.kind), resolved_by: me().name, resolved_at: new Date().toISOString() }) });
          S.openVar = (S.openVar||[]).filter((r)=> String(r.id) !== String(id));
          render();
        }catch(err){ b.disabled = false; b.textContent = `${t('save_err')}`; }
      };
    });
  },
};

/* ───────────────────────── boot ───────────────────────── */
document.getElementById('back').onclick = back;
document.getElementById('langbtn').onclick = ()=>{
  LANG = LANG === 'ar' ? 'en' : 'ar';
  try{ localStorage.setItem(LANG_KEY, LANG); }catch{}
  render();
};

(async function init(){
  render();
  if(!savedAuth()){ go('login', false); return; }
  try{
    await loadAll();
    try{
      const v = await restAll('stock_counts?select=*&resolution=is.null&variance=neq.0&order=counted_at.desc');
      S.openVar = AU.openVariances(v);
    }catch(e){ S.openVar = []; }
    S.probs = null;
    go('home', false);
  }catch(e){
    if(String(e.message) === 'no-session'){ go('login', false); return; }
    S.msg = String(e.message).slice(0,200);
    document.getElementById('app').innerHTML =
      `<div class="doneicon">😕</div><p class="donebig">${t('err')}</p>${msgHtml()}`;
  }
})();
</script>
